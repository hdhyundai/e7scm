                                </div>
                                <div className="flex flex-wrap gap-2 relative z-10">
                                  {Object.entries(dept.jobs).map(([job, stats]) => {
                                    return (
                                      <button key={job} onClick={(e) => { e.stopPropagation(); setSelectedConfirmedDept({dept: dept.name, job: job}); }} className="text-[11px] font-bold bg-slate-50 text-slate-600 px-2.5 py-1 rounded-md border border-slate-100 hover:bg-slate-800 hover:border-slate-800 hover:text-white transition-colors cursor-pointer flex items-center shadow-sm">
                                        {job} <span className="ml-1.5 font-black">{stats.arr}/{stats.req}</span>
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>
                            )
                          })
                        )
                      )}
                    </div>
                  </div>

                  {authRole !== 'production' && (
                    <div className="dx-glass rounded-[2rem] border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                      <div className="p-6 sm:p-8 border-b border-slate-100 flex items-center justify-between bg-white/50">
                        <div className="flex items-center flex-wrap gap-3">
                          <div className="bg-slate-100 p-2.5 rounded-xl border border-slate-200 shrink-0"><Globe size={24} className="text-slate-700" /></div>
                          <h3 className="text-lg sm:text-xl font-black text-slate-800 tracking-tight flex items-center flex-wrap gap-2">
                            공급 출처 관제
                            {filterStatus === 'completed' && <span className="text-xs bg-cyan-50 text-cyan-700 px-2 py-1 rounded-lg border border-cyan-200 shadow-sm ml-2">입국 누적 기준</span>}
                            {filterStatus === 'planned' && <span className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-lg border border-blue-200 shadow-sm ml-2">향후 예정 기준</span>}
                            {filterStatus === 'current_wave' && <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-lg border border-indigo-200 shadow-sm ml-2">{currentWaveIndex + 1}차 당해 입국 기준</span>}
                          </h3>
                        </div>
                      </div>
                      <div className="px-6 sm:px-8 py-4 border-b border-slate-100 bg-slate-50/80 overflow-x-auto hide-scrollbar">
                        <div className="flex flex-col gap-3">
                          <div className="flex items-center space-x-3 w-max">
                            <span className="text-xs font-black text-slate-400 bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">직무 필터</span>
                            <div className="flex space-x-2">
                              {availableJobs.map(job => (
                                <button key={job} onClick={() => setSelectedJobFilter(job)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${selectedJobFilter === job ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}`}>
                                  {job}
                                </button>
                              ))}
                            </div>
                          </div>
                          <div className="flex items-center space-x-3 w-max">
                            <span className="text-xs font-black text-slate-400 bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">국가 필터</span>
                            <div className="flex space-x-2">
                              {availableCountries.map(country => (
                                <button key={country} onClick={() => setSelectedCountryFilter(country)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center ${selectedCountryFilter === country ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}`}>
                                  {country !== '전체' && <MapPin size={12} className={`mr-1.5 ${country === '베트남' ? 'text-rose-400' : 'text-cyan-400'}`} />} {country}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                      <div className="p-6 sm:p-8 flex-1 overflow-y-auto max-h-[600px] hide-scrollbar">
                        {sourceSummary.agency.length === 0 ? <p className="text-center text-slate-400 py-16 font-semibold">해당 조건의 데이터가 없습니다.</p> : (
                          <>
                            <div className="flex flex-col sm:flex-row mb-8 border-b border-slate-100 pb-8 gap-8">
                              <div className="w-full sm:w-1/2 flex flex-col items-center">
                                <span className="text-xs font-bold text-slate-500 mb-2 bg-slate-100 px-3 py-1 rounded-lg">국가 비중</span>
                                <div className="w-full h-[180px]">
                                  <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                      <Pie data={sourceSummary.country} cx="50%" cy="50%" innerRadius={30} outerRadius={50} dataKey="value" paddingAngle={5} stroke="none">
                                        {sourceSummary.country.map((e, i) => <Cell key={i} fill={['#0284c7', '#0ea5e9'][i%2]} />)}
                                      </Pie>
                                      <RechartsTooltip contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}}/>
                                      <Legend verticalAlign="bottom" height={36}/>
                                    </PieChart>
                                  </ResponsiveContainer>
                                </div>
                              </div>
                              <div className="w-full sm:w-1/2 flex flex-col items-center sm:border-l border-slate-100">
                                <span className="text-xs font-bold text-slate-500 mb-2 bg-slate-100 px-3 py-1 rounded-lg">트랙 비중</span>
                                <div className="w-full h-[180px]">
                                  <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                      <Pie data={sourceSummary.track} cx="50%" cy="50%" innerRadius={30} outerRadius={50} dataKey="value" paddingAngle={5} stroke="none">
                                        {sourceSummary.track.map((e, i) => <Cell key={i} fill={['#0f172a', '#334155'][i%2]} />)}
                                      </Pie>
                                      <RechartsTooltip contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}}/>
                                      <Legend verticalAlign="bottom" height={36}/>
                                    </PieChart>
                                  </ResponsiveContainer>
                                </div>
                              </div>
                            </div>
                            <div className="space-y-4">
                              {sourceSummary.agency.map((agency, idx) => {
                                const width = `${(agency.value / sourceSummary.agency[0].value) * 100}%`;
                                return (
                                  <div key={idx} 
                                       onClick={() => setSelectedAgencyModal(agency.name)}
                                       className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer hover:border-slate-400 hover:shadow-md transition-all group">
                                    <div className="flex flex-wrap justify-between items-center text-sm font-bold text-slate-800 mb-3 gap-2">
                                      <span className="flex items-center leading-normal whitespace-nowrap">
                                        <MapPin size={16} className={`mr-2 shrink-0 ${agency.country === '베트남' ? 'text-rose-500' : 'text-cyan-500'}`}/>
                                        <span className="font-black text-base group-hover:text-slate-900 transition-colors">{agency.name}</span>
                                        <span className="text-slate-400 ml-2 font-semibold text-xs">({agency.country})</span>
                                      </span>
                                      <span className="font-black text-slate-800 text-base shrink-0">{agency.value}명</span>
                                    </div>
                                    <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden shadow-inner">
                                      <div className="bg-slate-800 h-full rounded-full transition-all duration-500" style={{ width }}></div>
                                    </div>
                                  </div>
                                )
                              })}
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 데이터 연동 설정 (관리자 전용 영역) */}
            {activeTab === 'data' && authRole === 'admin' && (
              <div className="animate-in fade-in duration-500 max-w-6xl mx-auto slide-in-from-bottom-4">
                
                <div className="dx-glass p-8 sm:p-12 rounded-[2rem] border border-cyan-200/50 shadow-xl mb-8 relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-8 opacity-[0.03] pointer-events-none">
                    <ShieldCheck size={200} className="text-slate-900" />
                  </div>
                  <div className="flex items-center space-x-4 mb-4 relative z-10">
                    <div className="bg-slate-900 p-3 rounded-2xl shadow-md border border-slate-700">
                      <ShieldCheck className="text-cyan-400 w-8 h-8" />
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">관리자 시스템 설정</h2>
                  </div>
                  <p className="text-slate-500 font-medium mb-10 relative z-10 text-base">
                    구글 멀티 시트 동기화 설정 및 로컬 데이터 강제 덮어쓰기 기능을 제공합니다.
                  </p>

                  {/* 조직별 비밀번호 설정 영역 */}
                  <div className="bg-slate-50/50 rounded-3xl p-6 sm:p-8 border border-slate-200 mb-10 relative z-10">
                    <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center"><Lock size={20} className="mr-2 text-slate-500"/> 조직별 접속 비밀번호 변경 (로컬 암호화 저장)</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="p-5 rounded-2xl bg-white border border-slate-200 flex flex-col items-start shadow-sm transition-all hover:shadow-md">
                        <h4 className="font-bold text-slate-800 mb-3">생산부서</h4>
                        <input type="password" value={newProdPw} onChange={e => setNewProdPw(e.target.value)} placeholder="새 비밀번호 입력" className="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-cyan-500 outline-none mb-3 text-sm transition-colors"/>
                        <button onClick={() => handleChangePassword('생산부서', newProdPw, setHashProd, 'hash_prod', setNewProdPw)} className="w-full py-2.5 bg-slate-800 hover:bg-black text-white font-bold rounded-xl text-sm transition-colors">변경 저장</button>
                      </div>
                      <div className="p-5 rounded-2xl bg-white border border-slate-200 flex flex-col items-start shadow-sm transition-all hover:shadow-md">
                        <h4 className="font-bold text-slate-800 mb-3">경영지원본부</h4>
                        <input type="password" value={newMgmtPw} onChange={e => setNewMgmtPw(e.target.value)} placeholder="새 비밀번호 입력" className="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-cyan-500 outline-none mb-3 text-sm transition-colors"/>
                        <button onClick={() => handleChangePassword('경영지원본부', newMgmtPw, setHashMgmt, 'hash_mgmt', setNewMgmtPw)} className="w-full py-2.5 bg-slate-800 hover:bg-black text-white font-bold rounded-xl text-sm transition-colors">변경 저장</button>
                      </div>
                      <div className="p-5 rounded-2xl bg-white border border-slate-200 flex flex-col items-start shadow-sm transition-all hover:shadow-md">
                        <h4 className="font-bold text-slate-800 mb-3">시스템 관리자</h4>
                        <input type="password" value={newAdminPw} onChange={e => setNewAdminPw(e.target.value)} placeholder="새 비밀번호 입력" className="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-cyan-500 outline-none mb-3 text-sm transition-colors"/>
                        <button onClick={() => handleChangePassword('시스템 관리자', newAdminPw, setHashAdmin, 'hash_admin', setNewAdminPw)} className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-xl text-sm transition-colors">변경 저장</button>
                      </div>
                    </div>
                    <p className="mt-4 text-xs font-bold text-rose-500 bg-rose-50 p-3 rounded-xl border border-rose-100 flex items-center leading-relaxed break-keep">
                      <AlertCircle size={16} className="mr-1.5 shrink-0" />
                      참고: 서버(데이터베이스)가 없는 정적 웹페이지(GitHub Pages) 특성상, 여기서 변경한 비밀번호는 "현재 설정 작업을 진행 중인 PC의 브라우저 로컬 저장소"에만 적용됩니다. 모든 사용자에게 변경된 비밀번호 일괄 적용하시려면 초기 코드의 해시값을 변경 후 재배포하셔야 합니다.
                    </p>
                  </div>

                  {/* 로컬 업로드 영역 */}
                  <div className="bg-slate-50/50 rounded-3xl p-6 sm:p-8 border border-slate-200 mb-10 relative z-10">
                    <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center"><Upload size={20} className="mr-2 text-slate-500"/> 로컬 CSV 강제 덮어쓰기 (수동)</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="p-6 rounded-2xl bg-white border border-slate-200 flex flex-col items-start shadow-sm transition-all hover:shadow-md hover:border-slate-300">
                        <h4 className="font-black text-slate-800 mb-1.5 text-lg">사전기량검증 CSV</h4>
                        <p className="text-sm text-slate-500 font-medium mb-6">사전평가 데이터가 담긴 내보내기 파일을 선택하세요.</p>
                        <label className="w-full text-center cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-6 py-4 rounded-xl font-bold transition-all shadow-sm">
                          사전평가 파일 선택
                          <input type="file" accept=".csv" onChange={(e) => handleLocalCsvUpload(e, 'pre')} className="hidden" />
                        </label>
                      </div>

                      <div className="p-6 rounded-2xl bg-white border border-slate-200 flex flex-col items-start shadow-sm transition-all hover:shadow-md hover:border-slate-300">
                        <h4 className="font-black text-slate-800 mb-1.5 text-lg">본기량검증 CSV</h4>
                        <p className="text-sm text-slate-500 font-medium mb-6">본평가 및 배치 데이터가 담긴 파일을 선택하세요.</p>
                        <label className="w-full text-center cursor-pointer bg-slate-800 hover:bg-slate-900 text-white px-6 py-4 rounded-xl font-bold transition-all shadow-sm border border-slate-700">
                          본평가 파일 선택
                          <input type="file" accept=".csv" onChange={(e) => handleLocalCsvUpload(e, 'main')} className="hidden" />
                        </label>
                      </div>
                    </div>
                  </div>
                  
                  {/* 가이드 영역 */}
                  <div className="bg-amber-50/80 border border-amber-200/60 rounded-3xl p-6 sm:p-8 mb-10 flex flex-col gap-2 shadow-sm relative z-10">
                     <h3 className="text-lg font-black text-amber-900 flex items-center tracking-tight"><AlertCircle className="w-5 h-5 mr-2 text-amber-600"/> 데이터 무결성 가이드 (탈락일자 표기법)</h3>
                     <p className="text-sm text-amber-800 font-medium leading-relaxed">
                       탈락 여부를 기록할 때 '탈락'이라는 글자 대신 <strong>탈락한 날짜(예: 3/15)</strong>를 입력하시면 타임라인 슬라이더의 주차 이동에 따라 탈락 인원도 동적으로 변동되어 표시됩니다.
                     </p>
                     <ul className="list-disc list-inside text-sm text-amber-800 font-bold ml-4 mt-3 space-y-2">
                       <li>사전기량검증: 합격일자는 <strong>Z열</strong> / 사전기량 탈락일자는 <strong>AA열</strong>에 날짜 기재</li>
                       <li>본기량검증(본평가): 본기량 합격일자 <strong>Z열</strong> / 본기량 탈락일자 <strong>AA열</strong>에 날짜 기재</li>
                       <li>본기량검증(입국): 입국일자 <strong>AB열</strong> / 입국 탈락일자 <strong>AC열</strong>에 날짜 기재</li>
                       <li>본기량검증(인성검사): 검사지 URL은 <strong>AG열</strong>에 기재</li>
                     </ul>
                  </div>

                  {/* 구글 시트 연동 설정 영역 */}
                  <div className="flex items-center justify-between mb-6 relative z-10 mt-4">
                    <h3 className="text-lg font-black text-slate-800 flex items-center tracking-tight"><Database size={20} className="mr-2 text-slate-500"/> 클라우드 DB 연동 소스 설정</h3>
                  </div>

                  <div className="grid grid-cols-1 gap-8 relative z-10">
                    <div className="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200 shadow-sm">
                      <div className="flex items-center space-x-3 mb-6">
                        <Database className="text-slate-800" />
                        <h2 className="text-xl font-black text-slate-800 tracking-tight">1. 부서 요청 및 공급 계획 시트 (마스터 DB)</h2>
                      </div>
                      <input type="text" value={baseSheetUrl} onChange={e => setBaseSheetUrl(e.target.value)} placeholder="Sheet1, Sheet2가 포함된 시트 주소" className="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-cyan-500 outline-none font-mono text-sm text-slate-700 mb-6 bg-slate-50 transition-colors" />
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-5 rounded-2xl bg-slate-50 border border-slate-100">
                          <h4 className="font-black text-slate-700 mb-3 flex justify-between items-center tracking-tight">부서 요청 탭 <input type="text" value={deptTabName} onChange={e => setDeptTabName(e.target.value)} className="w-24 border-b-2 border-slate-300 focus:border-cyan-500 bg-transparent text-right outline-none text-slate-900 transition-colors font-bold" /></h4>
                          <p className="text-xs text-slate-500 font-medium">부서명 / 직무 / 인원 / 요청월</p>
                        </div>
                        <div className="p-5 rounded-2xl bg-slate-50 border border-slate-100">
                          <h4 className="font-black text-slate-700 mb-3 flex justify-between items-center tracking-tight">공급 계획 탭 <input type="text" value={agencyTabName} onChange={e => setAgencyTabName(e.target.value)} className="w-24 border-b-2 border-slate-300 focus:border-cyan-500 bg-transparent text-right outline-none text-slate-900 transition-colors font-bold" /></h4>
                          <p className="text-xs text-slate-500 font-medium">국가 / 트랙 / 업체 / 직무 / 인원 등</p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200 shadow-sm">
                      <div className="flex items-center space-x-3 mb-6">
                        <FileSpreadsheet className="text-slate-800" />
                        <h2 className="text-xl font-black text-slate-800 tracking-tight">2. 실제 개인 명단 및 평가표 시트 (로우 DB)</h2>
                      </div>
                      <input type="text" value={individualSheetUrl} onChange={e => setIndividualSheetUrl(e.target.value)} placeholder="평가표가 포함된 시트 주소" className="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-cyan-500 outline-none font-mono text-sm text-slate-700 mb-6 bg-slate-50 transition-colors" />
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-5 rounded-2xl bg-slate-50 border border-slate-100">
                          <h4 className="font-black text-slate-700 mb-3 flex justify-between items-center tracking-tight">사전기량 탭 <input type="text" value={individualTabName1} onChange={e => setIndividualTabName1(e.target.value)} className="w-28 border-b-2 border-slate-300 focus:border-cyan-500 bg-transparent text-right outline-none text-slate-900 transition-colors font-bold" /></h4>
                          <p className="text-xs text-slate-500 font-medium">사전평가 기량, 한국어 점수 등</p>
                        </div>
                        <div className="p-5 rounded-2xl bg-slate-50 border border-slate-100">
                          <h4 className="font-black text-slate-700 mb-3 flex justify-between items-center tracking-tight">본기량 탭 <input type="text" value={individualTabName2} onChange={e => setIndividualTabName2(e.target.value)} className="w-28 border-b-2 border-slate-300 focus:border-cyan-500 bg-transparent text-right outline-none text-slate-900 transition-colors font-bold" /></h4>
                          <p className="text-xs text-slate-500 font-medium">본평가 점수, 최종 입국 주차, 부서 등</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
              </div>
            )}
          </div>

          {/* 모달 렌더링 영역 */}
          <DeptModal isOpen={!!selectedDept} onClose={() => setSelectedDept(null)} dept={selectedDept} currentWeek={currentWeek} data={allocatedResults.filter(item => item.dept === selectedDept)} filterStatus={filterStatus} authRole={authRole} />
          <ConfirmedDeptModal isOpen={!!selectedConfirmedDept} onClose={() => setSelectedConfirmedDept(null)} selection={selectedConfirmedDept} confirmedDeptSummary={confirmedDeptSummary} filterStatus={filterStatus} authRole={authRole} />
          
          <AgencyDetailModal 
            isOpen={!!selectedAgencyModal} 
            onClose={() => setSelectedAgencyModal(null)} 
            agencyName={selectedAgencyModal} 
            agencySupplyDB={agencySupplyDB} 
            individuals={individualsWithDept}
          />
          
          <IndividualDetailModal 
            isOpen={!!selectedStageModal} 
            onClose={() => setSelectedStageModal(null)} 
            stage={selectedStageModal?.stage} 
            viewType={selectedStageModal?.viewType} 
            individuals={individualsWithDept} 
            currentWeek={currentWeek} 
            authRole={authRole}
          />
          
          {/* --- 커스텀 알림창(MessageBox) 렌더링 영역 --- */}
          {alertMessage && (
            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl animate-in zoom-in-95 duration-300 max-h-[80vh] flex flex-col border border-slate-200">
                <div className="flex items-start space-x-4 overflow-y-auto hide-scrollbar">
                  <div className="bg-slate-100 p-2 rounded-xl shrink-0 border border-slate-200 mt-1">
                    <AlertCircle className="text-slate-800 w-6 h-6" />
                  </div>
                  <div className="flex-1 whitespace-pre-wrap text-slate-800 font-bold leading-relaxed pt-1.5 tracking-tight">{alertMessage}</div>
                </div>
                <div className="mt-8 flex justify-end shrink-0">
                  <button 
                    onClick={() => setAlertMessage(null)} 
                    className="px-6 py-3 bg-slate-800 text-white rounded-xl font-black hover:bg-black transition-colors shadow-md border border-slate-700"
                  >
                    확인 완료
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- [Mount Application] ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
