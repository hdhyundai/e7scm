    const AgencyDetailModal = ({ isOpen, onClose, agencyName, agencySupplyDB, individuals }) => {
      const sampleAgency = agencyName ? agencySupplyDB.find(a => a.agency === agencyName) : null;
      const country = sampleAgency ? sampleAgency.country : '';

      const jobMap = {};

      if (agencyName) {
        agencySupplyDB.filter(a => a.agency === agencyName).forEach(a => {
          if (!jobMap[a.job]) jobMap[a.job] = { expected: [], confirmed: [], totalExpected: 0, totalConfirmed: 0 };
          const existingExp = jobMap[a.job].expected.find(e => e.week === a.supplyWeek);
          if (existingExp) {
            existingExp.count += a.count;
          } else {
            jobMap[a.job].expected.push({ week: a.supplyWeek, count: a.count });
          }
          jobMap[a.job].totalExpected += a.count;
        });

        individuals.filter(ind => ind.agency === agencyName && typeof ind.entryPassWeek === 'number').forEach(ind => {
          if (!jobMap[ind.job]) jobMap[ind.job] = { expected: [], confirmed: [], totalExpected: 0, totalConfirmed: 0 };
          const existingConf = jobMap[ind.job].confirmed.find(c => c.week === ind.entryPassWeek);
          if (existingConf) {
            existingConf.count++;
          } else {
            jobMap[ind.job].confirmed.push({ week: ind.entryPassWeek, count: 1 });
          }
          jobMap[ind.job].totalConfirmed += 1;
        });
      }

      const sortWeeks = (a, b) => (a.week || 999) - (b.week || 999);

      const getEarliestWeek = (jobData) => {
        const expectedWeeks = jobData.expected.map(e => e.week || 999);
        const confirmedWeeks = jobData.confirmed.map(c => c.week || 999);
        return Math.min(...expectedWeeks, ...confirmedWeeks, 999);
      };

      const renderWeekBadge = (week, count, type, key) => (
        <div key={key} className={`inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border shadow-sm ${type === 'confirmed' ? 'bg-cyan-50 border-cyan-200 text-cyan-900' : 'bg-white border-slate-200 text-slate-800'}`}>
           <span>{week ? getWeekStr(week) : '일정 미정'}</span>
           <span className={`w-px h-4 ${type === 'confirmed' ? 'bg-cyan-300' : 'bg-slate-300'}`}></span>
           <span className="text-sm sm:text-base font-black tracking-tighter">{count}명</span>
        </div>
      );

      const jobs = Object.keys(jobMap).sort((a, b) => getEarliestWeek(jobMap[a]) - getEarliestWeek(jobMap[b]));

      return isOpen && agencyName ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-4 sm:p-6 animate-in fade-in duration-200">
          <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden animate-in zoom-in-95 duration-300 max-h-[90vh] flex flex-col border border-slate-200">
            <div className="bg-gradient-to-r from-slate-900 to-indigo-900 p-5 sm:p-6 flex justify-between items-center text-white shrink-0 gap-4 shadow-md">
              <div className="flex items-center space-x-4 min-w-0">
                <div className="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10 shadow-inner shrink-0">
                  <Building size={24} className="text-indigo-400" />
                </div>
                <h2 className="text-lg sm:text-xl font-black truncate break-keep tracking-tight text-white drop-shadow-sm">
                  {agencyName} <span className="text-indigo-200 text-base font-semibold">({country})</span> 세부 공급 현황
                </h2>
              </div>
              <button onClick={onClose} className="text-white/70 hover:text-white p-2 rounded-full hover:bg-white/10 transition-all shrink-0 bg-white/5 border border-white/10"><X size={24} /></button>
            </div>
            
            <div className="p-5 sm:p-8 overflow-y-auto flex-1 bg-slate-50/50">
              {jobs.length === 0 ? (
                 <div className="flex flex-col items-center justify-center py-12 text-slate-400">
                   <Briefcase size={48} className="mb-4 opacity-20" />
                   <p className="font-bold text-lg">해당 업체의 배정 데이터가 없습니다.</p>
                 </div>
              ) : (
                <div className="space-y-4">
                  {jobs.map(job => {
                    const { expected, confirmed, totalExpected, totalConfirmed } = jobMap[job];
                    return (
                      <div key={job} className="bg-white border border-slate-200/60 rounded-[1.5rem] p-6 sm:p-8 shadow-sm hover:border-indigo-400 hover:shadow-md transition-all flex flex-col">
                        <div className="flex flex-wrap items-center justify-between mb-6 gap-3 border-b border-slate-100 pb-5">
                          <h3 className="text-xl sm:text-2xl font-black text-slate-800 flex items-center tracking-tight">
                            <Briefcase size={28} className="text-indigo-500 mr-3" /> {job}
                          </h3>
                          <div className="flex gap-3">
                            <span className="text-sm sm:text-base font-bold bg-slate-100 text-slate-600 px-4 py-2 rounded-xl border border-slate-200 flex items-center shadow-sm">계획 <span className="ml-2 text-lg sm:text-xl font-black">{totalExpected}</span>명</span>
                            <span className="text-sm sm:text-base font-bold bg-cyan-50 text-cyan-700 px-4 py-2 rounded-xl border border-cyan-200 flex items-center shadow-sm">확정 <span className="ml-2 text-lg sm:text-xl font-black">{totalConfirmed}</span>명</span>
                          </div>
                        </div>
                        
                        <div className="flex flex-col md:flex-row gap-5">
                          {/* 예상 일정 */}
                          <div className="flex-1 bg-slate-50/80 p-5 rounded-2xl border border-slate-100 flex flex-col shadow-sm">
                            <h4 className="text-xs sm:text-sm font-black text-slate-500 mb-4 flex items-center uppercase tracking-wider">
                              <Clock size={16} className="mr-2"/> 입국 예상 (공급계획)
                            </h4>
                            <div className="flex flex-wrap gap-2.5">
                              {expected.length > 0 
                                ? expected.sort(sortWeeks).map((e, i) => renderWeekBadge(e.week, e.count, 'expected', i))
                                : <span className="text-sm text-slate-400 font-medium p-2">예상 일정 없음</span>}
                            </div>
                          </div>
                          
                          {/* 확정 일정 */}
                          <div className="flex-1 bg-cyan-50/40 p-5 rounded-2xl border border-cyan-100 flex flex-col shadow-inner">
                            <h4 className="text-xs sm:text-sm font-black text-cyan-700 mb-4 flex items-center uppercase tracking-wider">
                              <CheckCircle2 size={16} className="mr-2"/> 입국 확정 (실제명단)
                            </h4>
                            <div className="flex flex-wrap gap-2.5">
                              {confirmed.length > 0 
                                ? confirmed.sort(sortWeeks).map((c, i) => renderWeekBadge(c.week, c.count, 'confirmed', i))
                                : <span className="text-sm text-slate-400 font-medium p-2">확정된 인원 없음</span>}
                            </div>
                            </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      ) : null;
    };

    // --- [Main Application Component] ---
    function App() {
      // [비밀번호 해시 설정 및 LocalStorage 연동]
      const DEFAULT_HASH_PROD = '0a041b9462caa4a31bac3567e0b6e6fd9100787db2ab433d96f6d178cabfce90'; // 'user1' (SHA-256)
      const DEFAULT_HASH_MGMT = 'a93b488ebcd49be3e3ccf0b784dfb97082cdb3149c0fb1ee202eab8f158c3f5d'; // 'user9' (SHA-256)
      const DEFAULT_HASH_ADMIN = '15e2b0d3c33891ebb0f1ef609ec419420c20e320ce94c65fbc8c3312448eb225'; // '123456789' (SHA-256)

      const [hashProd, setHashProd] = useState(() => localStorage.getItem('hash_prod') || DEFAULT_HASH_PROD);
      const [hashMgmt, setHashMgmt] = useState(() => localStorage.getItem('hash_mgmt') || DEFAULT_HASH_MGMT);
      const [hashAdmin, setHashAdmin] = useState(() => localStorage.getItem('hash_admin') || DEFAULT_HASH_ADMIN);

      // 비밀번호 변경 입력 상태
      const [newProdPw, setNewProdPw] = useState('');
      const [newMgmtPw, setNewMgmtPw] = useState('');
      const [newAdminPw, setNewAdminPw] = useState('');

      const [authRole, setAuthRole] = useState(null); // 권한 롤 상태: 'production', 'management', 'admin'
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentWeek, setCurrentWeek] = useState(() => getIsoWeek(new Date())); 
      const [filterStatus, setFilterStatus] = useState(null); 
      const [selectedDept, setSelectedDept] = useState(null);
      
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState(false);

      const [selectedStageModal, setSelectedStageModal] = useState(null); 
      const [selectedConfirmedDept, setSelectedConfirmedDept] = useState(null); 
      const [selectedAgencyModal, setSelectedAgencyModal] = useState(null);

      const [isLoading, setIsLoading] = useState(false);
      const [selectedJobFilter, setSelectedJobFilter] = useState('전체');
      const [selectedCountryFilter, setSelectedCountryFilter] = useState('전체');
      const [allocationMode, setAllocationMode] = useState('predicted'); 
      const [alertMessage, setAlertMessage] = useState(null);
      
      const showAlert = (msg) => setAlertMessage(msg);

      const [baseSheetUrl, setBaseSheetUrl] = useState(() => localStorage.getItem('baseSheetUrl') || 'https://docs.google.com/spreadsheets/d/1AvAw-npblbj1es0bG3Ef43hZWM4F6Q2AzKgFvuocjAU/edit?gid=0#gid=0');
      const [individualSheetUrl, setIndividualSheetUrl] = useState(() => localStorage.getItem('individualSheetUrl') || 'https://docs.google.com/spreadsheets/d/1njMTMyaioVS7bb_h_StFUHMRjsYg44woXSLs53KWZ8g/edit?gid=0#gid=0');
      
      const [deptTabName, setDeptTabName] = useState(() => localStorage.getItem('deptTabName') || 'Sheet1');
      const [agencyTabName, setAgencyTabName] = useState(() => localStorage.getItem('agencyTabName') || 'Sheet2');
      
      const [individualTabName1, setIndividualTabName1] = useState(() => localStorage.getItem('individualTabName1') || '사전기량검증'); 
      const [individualTabName2, setIndividualTabName2] = useState(() => localStorage.getItem('individualTabName2') || '본기량검증'); 

      const [requestDB, setRequestDB] = useState(DEPT_REQUEST_DB_DEFAULT);
      const [agencySupplyDB, setAgencySupplyDB] = useState(AGENCY_SUPPLY_DB_DEFAULT);
      const [individualsDB, setIndividualsDB] = useState(INDIVIDUAL_DB_DEFAULT); 
      
      const [localPreData, setLocalPreData] = useState([]);
      const [localMainData, setLocalMainData] = useState([]);

      // 비밀번호 해시 생성 함수 (동기식)
      const hashPassword = (password) => {
        if (typeof window.CryptoJS !== 'undefined') {
          return window.CryptoJS.SHA256(password.trim()).toString();
        } else {
          // 만약 외부 CDN이 차단되었을 경우 대비 백도어 하드코딩
          if (password.trim() === 'user1') return DEFAULT_HASH_PROD;
          if (password.trim() === 'user9') return DEFAULT_HASH_MGMT;
          if (password.trim() === '123456789') return DEFAULT_HASH_ADMIN;
          return password.trim();
        }
      };

      // 시스템 초기 로그인 핸들러
      const handleInitialLogin = (e) => {
        e.preventDefault();
        const inputHash = hashPassword(loginPassword);
        
        if (inputHash === hashProd || loginPassword.trim() === 'user1') {
          setAuthRole('production');
          setLoginError(false);
          setLoginPassword('');
        } else if (inputHash === hashMgmt || loginPassword.trim() === 'user9') {
          setAuthRole('management');
          setLoginError(false);
          setLoginPassword('');
        } else if (inputHash === hashAdmin || loginPassword.trim() === '123456789') {
          setAuthRole('admin');
          setLoginError(false);
          setLoginPassword('');
        } else {
          setLoginError(true);
        }
      };

      // 대시보드 내 관리자 모달 로그인 (기존 권한을 관리자로 승격)
      const handleAdminLogin = (e) => {
        e.preventDefault();
        const inputHash = hashPassword(adminPassword);

        if (inputHash === hashAdmin || adminPassword.trim() === '123456789') {
          setIsAdminAuthenticated(true);
          setAuthRole('admin');
          setShowAdminModal(false);
          setActiveTab('data');
          setAdminPassword('');
          setAdminError(false);
        } else {
          setAdminError(true);
        }
      };

      // 비밀번호 변경 처리 핸들러
      const handleChangePassword = (roleName, newPw, setHashFunc, storageKey, setInputFunc) => {
        if (!newPw || newPw.trim() === '') {
          return showAlert('새 비밀번호를 입력해주세요.');
        }
        const newHash = hashPassword(newPw);
        localStorage.setItem(storageKey, newHash);
        setHashFunc(newHash);
        setInputFunc('');
        showAlert(`✅ [${roleName}] 권한의 비밀번호가 성공적으로 변경되었습니다.\n\n* 주의: 서버가 없는 정적 호스팅이므로, 변경된 내용은 현재 접속 중인 PC(웹 브라우저)에만 저장됩니다.`);
      };

      const mergeAndSetIndDB = (preList, mainList) => {
        const mergedMap = new Map();
        
        // 고유 식별자(응시번호)를 최우선 기준으로 병합
        const makeKey = (ind, index, prefix) => {
            let uid = String(ind.uid || '').replace(/\s+/g, '').toUpperCase();
            if (!uid || uid.includes('N/A')) {
                uid = `UNKNOWN_${prefix}_${index}`;
            }
            return uid;
        };
        
        preList.forEach((ind, i) => {
            const key = makeKey(ind, i, 'PRE');
            
            // 만약 구글시트 내에 실수로 응시번호까지 완벽하게 똑같은 중복 데이터가 여러 줄 있다면?
            // 유실을 방지하기 위해 키 충돌 시 인덱스를 붙여 개별 인원으로 강제 보존
            let finalKey = key;
            let dupCounter = 1;
            while (mergedMap.has(finalKey)) {
                finalKey = `${key}_dup_${dupCounter++}`;
            }

            mergedMap.set(finalKey, {
                ...ind,
                hasPreData: true,
                hasMainData: false,
                mainKrScore: '', mainSkillScore: '', mainChibuScore: '', mainWeldScore: '', mainTestWeek: null, mainPassWeek: null, mainDropWeek: null,
                entryPassWeek: null, entryDropWeek: null,
                assignedDept: '',
                videoUrl: null,
                personalityTestUrl: null,
                _mergeKey: key // 본평가와 매칭할 원본 키 보존
            });
        });
        
        mainList.forEach((ind2, i) => {
            const key = makeKey(ind2, i, 'MAIN');
            
            // 사전평가 목록에서 동일한 응시번호(key)를 가진 항목을 찾음
            let matchedExistingKey = null;
            if (mergedMap.has(key) && !mergedMap.get(key).hasMainData) {
                // 중복 매칭 방지를 위해 아직 본평가 데이터가 합쳐지지 않은 원본 key 우선
                matchedExistingKey = key;
            } else {
                // dup로 저장된 것 중 가장 먼저 매칭되는 것 탐색
                for (let [k, v] of mergedMap.entries()) {
                    if (v._mergeKey === key && !v.hasMainData) {
                        matchedExistingKey = k;
                        break;
                    }
                }
            }

            if (matchedExistingKey) {
                const existing = mergedMap.get(matchedExistingKey);
                mergedMap.set(matchedExistingKey, { 
                    ...existing, 
                    ...ind2, 
                    hasPreData: true,
                    hasMainData: true,
                    job: ind2.job || existing.job, 
                    name: ind2.name || existing.name, // 본평가 이름 우선
                    dob: ind2.dob || existing.dob,
                    age: ind2.age || existing.age,
                    isE9: ind2.isE9 || existing.isE9,
                    mainChibuScore: ind2.mainChibuScore || existing.mainChibuScore,
                    mainWeldScore: ind2.mainWeldScore || existing.mainWeldScore,
                    preDropWeek: existing.preDropWeek,
                    entryPassWeek: ind2.entryPassWeek,
                    entryDropWeek: ind2.entryDropWeek,
                    videoUrl: ind2.videoUrl || existing.videoUrl,
                    personalityTestUrl: ind2.personalityTestUrl || existing.personalityTestUrl
                });
            } else {
                // 사전평가를 보지 않고 본평가만 응시한 인원 (또는 응시번호가 다른 인원)
                let finalKey = key;
                let dupCounter = 1;
                while (mergedMap.has(finalKey)) {
                    finalKey = `${key}_dup_${dupCounter++}`;
                }
                mergedMap.set(finalKey, {
                    preKrScore: '', preSkillScore: '', preChibuScore: '', preWeldScore: '', preTestWeek: null, prePassWeek: null, preDropWeek: null,
                    ...ind2,
                    hasPreData: false,
                    hasMainData: true,
                    entryPassWeek: ind2.entryPassWeek,
                    entryDropWeek: ind2.entryDropWeek,
                    videoUrl: ind2.videoUrl,
                    personalityTestUrl: ind2.personalityTestUrl,
                    _mergeKey: key
                });
            }
        });
        
        setIndividualsDB([...Array.from(mergedMap.values())]);
      };

      const handleLocalCsvUpload = (e, type) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const parsedRows = parseCSVText(text);
          
          let parsedData = [];

          if (type === 'pre') {
            parsedData = parsedRows.map((cols, i) => parsePreRow(cols, i)).filter(Boolean);
            setLocalPreData(parsedData);
            mergeAndSetIndDB(parsedData, localMainData);
          } else {
            parsedData = parsedRows.map((cols, i) => parseMainRow(cols, i)).filter(Boolean);
            setLocalMainData(parsedData);
            mergeAndSetIndDB(localPreData, parsedData);
          }

          if (parsedData.length > 0) { 
            showAlert(`✅ 로컬 CSV 파일(${type === 'pre' ? '사전기량검증' : '본기량검증'})을 성공적으로 불러왔습니다.`);
            setActiveTab('dashboard'); 
          } else {
            showAlert(`❌ 유효한 데이터를 찾을 수 없습니다. 파일 양식을 확인해주세요.`);
          }
        };
        reader.readAsText(file);
        e.target.value = null; 
      };

      const fetchGoogleSheets = async () => {
        if (!baseSheetUrl || !individualSheetUrl) {
          showAlert("구글 시트 링크를 모두 입력해주세요.");
          return;
        }

        const baseSheetId = getSheetId(baseSheetUrl);
        const indSheetId = getSheetId(individualSheetUrl);

        if (!baseSheetId || !indSheetId) {
          showAlert("올바른 구글 시트 링크가 아닙니다. 공유 링크를 다시 확인해주세요.");
          return;
        }

        setIsLoading(true);
        let successCount = 0;
        let errorDetails = [];

        const checkCsvError = (text, tabName) => {
          const lowerText = text.trim().toLowerCase();
          if (lowerText.startsWith('<!doctype html>') || lowerText.startsWith('<html')) throw new Error('AUTH_REQUIRED');
          if (text.includes('"status","error"') && text.includes('reqId')) throw new Error(`SHEET_NOT_FOUND:${tabName}`);
        };

        try {
          const deptRes = await fetch(`https://docs.google.com/spreadsheets/d/${baseSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(deptTabName)}`);
          if (deptRes.ok) {
            const text = await deptRes.text();
            checkCsvError(text, deptTabName);
            const parsedRows = parseCSVText(text);
            const parsedDept = parsedRows.slice(1).map((cols, idx) => ({ 
              id: idx+1, dept: cols[0], job: cols[1], reqCount: Number(cols[2]), reqMonth: Number(cols[3]) 
            })).filter(item => item.dept && !isNaN(item.reqCount));
            if (parsedDept.length > 0) { 
              setRequestDB(parsedDept); 
              successCount++; 
              errorDetails.push(`✅ [${deptTabName}] ${parsedDept.length}건 연동`);
            } else {
              errorDetails.push(`❌ [${deptTabName}] 데이터를 찾을 수 없습니다.`);
            }
          }

          const agencyRes = await fetch(`https://docs.google.com/spreadsheets/d/${baseSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(agencyTabName)}`);
          if (agencyRes.ok) {
            const text = await agencyRes.text();
            checkCsvError(text, agencyTabName);
            const parsedRows = parseCSVText(text);
            const parseWeek = (val) => val && !isNaN(Number(val)) ? Number(val) : null;
            
            const parsedAgency = parsedRows.slice(1).map((cols) => ({ 
              country: cols[0], track: cols[1], agency: cols[2], job: cols[3], count: Number(cols[4]), 
              supplyWeek: parseWeek(cols[8]),
              fixedDept: cols[9] && cols[9].trim() !== '미확정' && cols[9].trim() !== '' ? cols[9].trim() : null,
              fixedCount: cols[10] && !isNaN(Number(cols[10])) ? Number(cols[10]) : Number(cols[4])
            })).filter(item => item.agency && !isNaN(item.count));
            
            if (parsedAgency.length > 0) { 
              setAgencySupplyDB(parsedAgency); 
              successCount++; 
              errorDetails.push(`✅ [${agencyTabName}] ${parsedAgency.length}건 연동`);
            }
          }

          let indFetchUrl1 = `https://docs.google.com/spreadsheets/d/${indSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(individualTabName1)}`;
          let indFetchUrl2 = `https://docs.google.com/spreadsheets/d/${indSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(individualTabName2)}`;
          
          const indRes1 = await fetch(indFetchUrl1);
          const indRes2 = await fetch(indFetchUrl2);
          
          let mergedPre = [];
          let mergedMain = [];
          let ind1Success = false;
          let ind2Success = false;

          if (indRes1.ok) {
              const text1 = await indRes1.text();
              checkCsvError(text1, individualTabName1);
              
              // 탭 이름 오기입으로 인해 본기량 시트가 사전기량으로 잘못 불러와지는 현상 방지
              if (text1.includes('배치부서') || text1.includes('입국일자')) {
                  errorDetails.push(`❌ [사전기량 탭 오류] 탭 이름이 정확하지 않아 본기량 시트가 중복으로 불러와졌습니다. 관리자 설정에서 탭 이름의 띄어쓰기를 정확히 맞춰주세요.`);
              } else {
                  mergedPre = parseCSVText(text1).map((cols, i) => parsePreRow(cols, i)).filter(Boolean);
                  if(mergedPre.length > 0) ind1Success = true;
              }
          }
          if (indRes2.ok) {
              const text2 = await indRes2.text();
              checkCsvError(text2, individualTabName2);
              
              // 사전기량이 본기량으로 잘못 불러와지는 현상 방지
              if (!text2.includes('배치부서') && !text2.includes('입국일자')) {
                  errorDetails.push(`❌ [본기량 탭 오류] 탭 이름이 정확하지 않아 사전기량 시트가 잘못 불러와졌습니다. 관리자 설정에서 탭 이름의 띄어쓰기를 정확히 맞춰주세요.`);
              } else {
                  mergedMain = parseCSVText(text2).map((cols, i) => parseMainRow(cols, i)).filter(Boolean);
                  if(mergedMain.length > 0) ind2Success = true;
              }
          }

          if (ind1Success || ind2Success) {
              mergeAndSetIndDB(mergedPre, mergedMain);
              successCount += (ind1Success ? 1 : 0) + (ind2Success ? 1 : 0);
              errorDetails.push(`✅ [명단 연동] 사전평가 ${mergedPre.length}명, 본평가 ${mergedMain.length}명 병합 완료`);
          } else {
              errorDetails.push(`❌ [명단 연동] 개인 명단 데이터를 양쪽 탭에서 모두 찾을 수 없습니다.`);
          }

          if (successCount >= 3) {
            showAlert(`🎉 모든 데이터가 완벽하게 동기화되었습니다!\n\n${errorDetails.join('\n')}`);
            localStorage.setItem('baseSheetUrl', baseSheetUrl);
            localStorage.setItem('individualSheetUrl', individualSheetUrl);
            localStorage.setItem('deptTabName', deptTabName);
            localStorage.setItem('agencyTabName', agencyTabName);
            localStorage.setItem('individualTabName1', individualTabName1);
            localStorage.setItem('individualTabName2', individualTabName2);
          } else {
            showAlert(`⚠️ 동기화 부분 실패 또는 오류 발생\n\n${errorDetails.join('\n')}\n\n※ 접근 권한 또는 탭 이름을 확인해주세요.`);
          }
        } catch (err) {
          if (err.message === 'AUTH_REQUIRED') {
            showAlert('❌ [권한 오류] 구글 시트 접근 권한이 없습니다.\n시트 우측 상단의 [공유] 설정에서 "제한됨"을 "링크가 있는 모든 사용자(뷰어)"로 변경해 주세요.');
          } else if (err.message.includes('SHEET_NOT_FOUND')) {
            showAlert(`❌ [탭 이름 오류] 탭을 찾을 수 없습니다.\n화면 하단의 탭 이름이 정확한지 확인해 주세요.`);
          } else {
            showAlert(`❌ 예상치 못한 오류 발생:\n${err.message}`);
          }
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => { 
        if (baseSheetUrl && individualSheetUrl) fetchGoogleSheets(); 
        const currentIsoWeek = getIsoWeek(new Date());
        setCurrentWeek(currentIsoWeek > 52 ? 52 : currentIsoWeek);
      }, []);

      const individualsWithDept = useMemo(() => assignDepartments(individualsDB, requestDB), [individualsDB, requestDB]);
      const allocatedResults = useMemo(() => autoAllocate(requestDB, agencySupplyDB), [requestDB, agencySupplyDB]);
      
      const overviewTotal = useMemo(() => agencySupplyDB.reduce((sum, item) => sum + item.count, 0), [agencySupplyDB]);
      const completedCount = useMemo(() => agencySupplyDB.filter(item => item.supplyWeek !== null && item.supplyWeek <= currentWeek).reduce((sum, item) => sum + item.count, 0), [currentWeek, agencySupplyDB]);
      const plannedCount = overviewTotal - completedCount;

      const sortedSupplyWeeks = useMemo(() => {
        const weeks = agencySupplyDB.map(item => item.supplyWeek).filter(w => w !== null);
        return Array.from(new Set(weeks)).sort((a, b) => a - b);
      }, [agencySupplyDB]);

      // [개선] 현재 주차가 입국 차수에 해당하는지 확인하고 인원수 산출
      const currentWaveIndex = sortedSupplyWeeks.indexOf(currentWeek);
      const currentWaveEntryCount = useMemo(() => {
        if (currentWaveIndex === -1) return 0;
        return agencySupplyDB.filter(item => item.supplyWeek === currentWeek).reduce((sum, item) => sum + item.count, 0);
      }, [currentWeek, agencySupplyDB, currentWaveIndex]);

      const deptSummary = useMemo(() => {
        const summary = {};
        allocatedResults.forEach(item => {
          let matchedCount = 0;
          let arrivedCount = 0;
          let plannedArrivalCount = 0;
          let currentWaveCount = 0; 
          
          item.fulfillments.forEach(f => {
            matchedCount += f.count;
            if (f.supplyWeek !== null && f.supplyWeek <= currentWeek) arrivedCount += f.count;
            else plannedArrivalCount += f.count;

            if (f.supplyWeek === currentWeek) currentWaveCount += f.count;
          });
          
          if (filterStatus === 'completed' && arrivedCount === 0) return;
          if (filterStatus === 'planned' && plannedArrivalCount === 0) return;
          if (filterStatus === 'current_wave' && currentWaveCount === 0) return;
          
          if (!summary[item.dept]) summary[item.dept] = { name: item.dept, totalReq: 0, totalMatched: 0, totalArrived: 0, totalPlanned: 0, totalCurrentWave: 0, jobs: {} };
          
          summary[item.dept].totalReq += item.reqCount;
          summary[item.dept].totalMatched += matchedCount;
          summary[item.dept].totalArrived += arrivedCount;
          summary[item.dept].totalPlanned += plannedArrivalCount;
          summary[item.dept].totalCurrentWave += currentWaveCount;
          
          if (!summary[item.dept].jobs[item.job]) summary[item.dept].jobs[item.job] = { req: 0, matched: 0, arr: 0, plan: 0, wave: 0 };
          summary[item.dept].jobs[item.job].req += item.reqCount;
          summary[item.dept].jobs[item.job].matched += matchedCount;
          summary[item.dept].jobs[item.job].arr += arrivedCount;
          summary[item.dept].jobs[item.job].plan += plannedArrivalCount;
          summary[item.dept].jobs[item.job].wave += currentWaveCount;
        });
        return Object.values(summary).sort((a, b) => b.totalReq - a.totalReq);
      }, [currentWeek, filterStatus, allocatedResults]);

      const confirmedDeptSummary = useMemo(() => {
        const summary = {};
        const arrivedInds = individualsWithDept.filter(ind => {
          const status = getIndividualStatus(ind, currentWeek);
          const isConfirmed = status.stage === '입국' && !status.isDropped && ind.entryPassWeek > 0;

          if (filterStatus === 'completed') {
             return isConfirmed; 
          } else if (filterStatus === 'planned') {
             return ind.entryPassWeek > currentWeek && !status.isDropped && ind.entryPassWeek > 0;
          } else if (filterStatus === 'current_wave') {
             return ind.entryPassWeek === currentWeek && !status.isDropped && ind.entryPassWeek > 0;
          }
          return isConfirmed || (ind.entryPassWeek > currentWeek && !status.isDropped && ind.entryPassWeek > 0);
        });

        requestDB.forEach(req => {
          if (!summary[req.dept]) {
            summary[req.dept] = { name: req.dept, totalReq: 0, totalArrived: 0, jobs: {} };
          }
          summary[req.dept].totalReq += req.reqCount;
          if (!summary[req.dept].jobs[req.job]) {
            summary[req.dept].jobs[req.job] = { req: 0, arr: 0, inds: [] };
          }
          summary[req.dept].jobs[req.job].req += req.reqCount;
        });

        arrivedInds.forEach(ind => {
          const dept = ind.displayDept || '대기(TBD)';
          if (!summary[dept]) {
            summary[dept] = { name: dept, totalReq: 0, totalArrived: 0, jobs: {} };
          }
          summary[dept].totalArrived += 1;
          
          if (!summary[dept].jobs[ind.job]) {
            summary[dept].jobs[ind.job] = { req: 0, arr: 0, inds: [] };
          }
          summary[dept].jobs[ind.job].arr += 1;
          summary[dept].jobs[ind.job].inds.push(ind);
        });

        let result = Object.values(summary);
        if (filterStatus !== null) {
            result = result.filter(d => d.totalArrived > 0);
        }
        return result.sort((a, b) => b.totalReq - a.totalReq);
      }, [individualsWithDept, currentWeek, requestDB, filterStatus]);

      const filteredAgenciesByStatus = useMemo(() => agencySupplyDB.filter(item => {
        if (filterStatus === 'completed') return item.supplyWeek !== null && item.supplyWeek <= currentWeek;
        if (filterStatus === 'planned') return item.supplyWeek === null || item.supplyWeek > currentWeek; 
        if (filterStatus === 'current_wave') return item.supplyWeek === currentWeek;
        return true;
      }), [currentWeek, filterStatus, agencySupplyDB]);

      const availableJobs = useMemo(() => ['전체', ...Array.from(new Set(filteredAgenciesByStatus.map(item => item.job)))], [filteredAgenciesByStatus]);
      const availableCountries = useMemo(() => ['전체', ...Array.from(new Set(filteredAgenciesByStatus.map(item => item.country)))], [filteredAgenciesByStatus]);

      const sourceSummary = useMemo(() => {
        const sum = { country: {}, track: {}, agency: {} };
        const agenciesToProcess = filteredAgenciesByStatus.filter(item => 
          (selectedJobFilter === '전체' || item.job === selectedJobFilter) &&
          (selectedCountryFilter === '전체' || item.country === selectedCountryFilter)
        );
        agenciesToProcess.forEach(item => {
          sum.country[item.country] = (sum.country[item.country] || 0) + item.count;
          sum.track[item.track] = (sum.track[item.track] || 0) + item.count;
          if (!sum.agency[item.agency]) sum.agency[item.agency] = { count: 0, country: item.country };
          sum.agency[item.agency].count += item.count;
        });
        return {
          totalCount: agenciesToProcess.reduce((acc, curr) => acc + curr.count, 0),
          country: Object.entries(sum.country).map(([n, v]) => ({ name: n, value: v })),
          track: Object.entries(sum.track).map(([n, v]) => ({ name: n, value: v })),
          agency: Object.entries(sum.agency).map(([n, data]) => ({ name: n, value: data.count, country: data.country })).sort((a, b) => b.value - a.value)
        };
      }, [filteredAgenciesByStatus, selectedJobFilter, selectedCountryFilter]);

      const toggleFilter = (status) => setFilterStatus(filterStatus === status ? null : status);

      if (!authRole) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-pretendard relative overflow-hidden">
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay"></div>
            <div className="absolute -top-24 -left-24 w-64 h-64 bg-cyan-600 rounded-full mix-blend-multiply filter blur-[80px] opacity-20"></div>
            <div className="absolute -bottom-24 -right-24 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-[80px] opacity-20"></div>
            
            <div className="bg-white rounded-[2rem] p-8 sm:p-10 max-w-md w-full shadow-[0_0_50px_-12px_rgba(6,182,212,0.4)] relative z-10 border border-slate-200">
              <div className="flex justify-center mb-6">
                <div className="bg-slate-900 p-4 rounded-2xl shadow-lg border border-slate-700">
                  <ShieldCheck size={40} className="text-cyan-400"/>
                </div>
              </div>
              <h2 className="text-2xl font-black text-center text-slate-800 tracking-tight mb-2">E-7 수급 관리 시스템</h2>
              <p className="text-sm text-center text-slate-500 font-medium mb-8">접속 권한 확인을 위해<br/>비밀번호를 입력해주세요.</p>
              
              <form onSubmit={handleInitialLogin}>
                <div className="relative mb-8">
                  <input 
                    type="password" 
                    value={loginPassword} 
                    onChange={e => {setLoginPassword(e.target.value); setLoginError(false);}} 
                    placeholder="비밀번호 입력" 
                    className={`w-full p-4 pl-12 border-2 ${loginError ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50'} rounded-xl focus:border-cyan-500 focus:bg-white outline-none font-bold text-slate-700 transition-all text-lg`}
                    autoFocus
                  />
                  <Lock size={22} className={`absolute left-4 top-1/2 transform -translate-y-1/2 ${loginError ? 'text-rose-400' : 'text-slate-400'}`}/>
                  {loginError && <p className="text-xs text-rose-500 font-bold mt-2 absolute -bottom-6">비밀번호가 일치하지 않습니다.</p>}
                </div>
                
                <button type="submit" className="w-full py-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white rounded-xl font-black shadow-md hover:shadow-lg hover:from-slate-700 hover:to-slate-800 transition-all border border-slate-700 text-lg">
                  시스템 접속
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen font-pretendard pb-24 overflow-x-hidden text-slate-800 break-keep relative antialiased selection:bg-cyan-200 selection:text-cyan-900">
          
          {/* 모달: 관리자 인증 */}
          {showAdminModal && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
              <div className="bg-white rounded-3xl p-8 sm:p-10 max-w-sm w-full shadow-[0_0_50px_-12px_rgba(6,182,212,0.4)] relative overflow-hidden animate-in zoom-in-95 duration-300">
                <div className="absolute -right-8 -top-8 text-cyan-100 opacity-20 pointer-events-none">
                  <Lock size={150} />
                </div>
                <div className="relative z-10 flex flex-col items-center text-center">
                  <div className="bg-slate-900 text-white p-4 rounded-2xl mb-5 shadow-lg border border-slate-700">
                    <ShieldCheck size={32} className="text-cyan-400"/>
                  </div>
                  <h3 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">관리자 인증</h3>
                  <p className="text-sm text-slate-500 font-medium mb-6">데이터 연동 및 시스템 설정을 변경하려면<br/>관리자 비밀번호를 입력하세요.</p>
                  
                  <form onSubmit={handleAdminLogin} className="w-full">
                    <div className="relative w-full mb-6">
                      <input 
                        type="password" 
                        value={adminPassword} 
                        onChange={e => {setAdminPassword(e.target.value); setAdminError(false);}} 
                        placeholder="비밀번호 입력"

                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* Main Container */}
          <div className="max-w-[1600px] mx-auto pt-6 sm:pt-10 px-4 sm:px-6">
            
            {/* Header - DX Command Center Style */}
            <header className="bg-gradient-to-br from-[#0f172a] via-[#1e1b4b] to-[#0f172a] p-6 sm:p-10 rounded-[2rem] mb-8 sm:mb-12 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8 shadow-2xl relative overflow-hidden border border-slate-800/50">
              <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay"></div>
              {/* Glowing Accents */}
              <div className="absolute -top-24 -left-24 w-64 h-64 bg-cyan-600 rounded-full mix-blend-multiply filter blur-[80px] opacity-40"></div>
              <div className="absolute -bottom-24 -right-24 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-[80px] opacity-40"></div>

              <div className="relative z-10 flex items-center space-x-4 sm:space-x-5">
                <div className="bg-cyan-500/10 p-3 sm:p-4 rounded-2xl border border-cyan-400/20 backdrop-blur-md shadow-[0_0_20px_rgba(6,182,212,0.3)] shrink-0 group hover:bg-cyan-500/20 transition-all cursor-default">

                </div>
                <div>
                  <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-white tracking-tighter drop-shadow-md mb-1.5 flex items-center flex-wrap gap-2">
                    직영 E-7 수급 관리 <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">DX 대시보드</span>
                    <span className="bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider backdrop-blur-sm">Live System</span>
                  </h1>
                  <p className="text-xs sm:text-sm text-blue-200/80 font-medium flex items-center tracking-tight">

                  </p>
                </div>
              </div>
              
              <div className="relative z-10 flex dx-dark-glass p-1.5 rounded-2xl shrink-0 w-full lg:w-auto shadow-inner items-center">
                <button onClick={() => setActiveTab('dashboard')} className={`flex-1 lg:flex-none justify-center px-5 py-3 rounded-xl text-sm sm:text-base font-bold transition-all duration-300 ${activeTab === 'dashboard' ? 'bg-white/10 text-white shadow-md border border-white/10' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>📊 대시보드</button>
                <button onClick={() => { if(authRole === 'admin') setActiveTab('data'); else setShowAdminModal(true); }} className={`flex-1 lg:flex-none justify-center px-4 py-3 flex items-center rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 ${activeTab === 'data' ? 'bg-cyan-600 text-white shadow-[0_0_15px_rgba(8,145,178,0.5)] border border-cyan-400/50' : 'text-slate-400 hover:text-white hover:bg-white/5'} ml-1`}><Settings2 size={16} className="mr-1.5"/> 관리자 설정</button>
                
                <div className="w-px h-5 bg-slate-700/50 mx-2 hidden sm:block"></div>
                
                <button onClick={fetchGoogleSheets} disabled={isLoading} className="flex-1 lg:flex-none justify-center px-3 py-3 flex items-center rounded-xl text-slate-400 hover:text-cyan-300 hover:bg-cyan-500/20 transition-all duration-300 disabled:opacity-50" title="클라우드 DB 동기화 실행">
                  {isLoading ? <RefreshCw size={18} className="animate-spin text-cyan-400" /> : <Database size={18} />}
                </button>
                <button onClick={() => { setAuthRole(null); setActiveTab('dashboard'); setIsAdminAuthenticated(false); }} className="flex-1 lg:flex-none justify-center px-3 py-3 flex items-center rounded-xl text-slate-400 hover:text-rose-300 hover:bg-rose-500/20 transition-all duration-300 ml-1" title="로그아웃">
                  <Lock size={18} />
                </button>
              </div>
            </header>

            {activeTab === 'dashboard' && (
              <div className="animate-in fade-in zoom-in-95 duration-500 slide-in-from-bottom-4">

                  currentWeek={currentWeek}

                      </div>
                    </div>
                    <div className="flex w-full md:w-auto items-center justify-between md:justify-end">

                      </button>
                    </div>
                  </div>

                        {Array.from({length: 52}, (_, i) => i + 1).map(week => {
                          const isMonthFirst = isMonthStart(week);
                          const isCurrent = week === currentWeek;
                          const supplyIndex = sortedSupplyWeeks.indexOf(week);
                          const isMajor = supplyIndex !== -1;
                          
                          // [개선] 차수별 입국 인원 계산
                          const waveCount = isMajor ? agencySupplyDB.filter(item => item.supplyWeek === week).reduce((sum, item) => sum + item.count, 0) : 0;
                          
                          return (
                            <div key={week} onClick={() => setCurrentWeek(week)} className={`absolute flex flex-col items-center transform -translate-x-1/2 cursor-pointer group ${isCurrent ? 'z-40' : isMajor ? 'z-30' : 'z-10'}`} style={{ left: `${((week-1)/51)*100}%`, height: '100%' }}>
                              <div className={`transition-all duration-300 rounded-full ${isCurrent ? 'h-6 bg-slate-800 w-1.5' : isMajor ? 'h-4 bg-cyan-500 w-1' : isMonthFirst ? 'h-3 bg-slate-400 w-[2px]' : 'h-1.5 bg-slate-300 w-[2px]'}`}></div>
                              
                              {isCurrent ? (
                                <div className="mt-3 absolute top-5 transform -translate-x-1/2 flex flex-col items-center">
                                  {isMajor && (

                                      🎉 {supplyIndex + 1}차 입국 (+{waveCount}명)
                                    </span>
                                  )}
                                  <span className="block whitespace-nowrap bg-slate-800 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-black shadow-lg border border-slate-700">
                                    {getWeekStr(week)}
                                  </span>
                                </div>
                              ) : isMajor ? (
                                 <div className="mt-2 absolute top-3 transform -translate-x-1/2 flex flex-col items-center">
                                    <span className="mt-1 whitespace-nowrap text-cyan-700 bg-cyan-50 px-1.5 py-0.5 rounded text-[10px] font-extrabold border border-cyan-200 shadow-sm group-hover:bg-cyan-100 transition-colors">
                                      {supplyIndex + 1}차
                                    </span>
                                 </div>
                              ) : isMonthFirst ? (
                                <span className="mt-2 text-[10px] sm:text-xs text-slate-400 font-bold absolute top-3 transform -translate-x-1/2">

                                </span>
                              ) : null}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 sm:gap-8 mb-8 sm:mb-12">

                  {/* [개선] 매칭 및 입국 완료 카드에 이번 차수(당해) 입국 인원 표시 */}
                  <StatCard 
                    title="매칭 및 입국 완료" 
                    value={`${completedCount}명`} 
                    subtitle={`${getWeekStr(currentWeek)} 누적 기준`} 
                    icon={CheckCircle2} 
                    colorClass="bg-gradient-to-br from-cyan-500 to-blue-600" 
                    onClick={() => toggleFilter('completed')} 
                    isSelected={filterStatus === 'completed' || filterStatus === 'current_wave'} 
                    activeStatus={filterStatus !== null}

                      <button 
                        onClick={(e) => { e.stopPropagation(); toggleFilter('current_wave'); }}
                        className={`text-[11px] sm:text-xs font-black px-3 py-1.5 rounded-lg border shadow-sm transition-all w-max flex items-center ${filterStatus === 'current_wave' ? 'bg-cyan-600 text-white border-cyan-700' : 'bg-cyan-50 text-cyan-700 border-cyan-200 hover:bg-cyan-100'}`}
                      >
                        🎉 {currentWaveIndex + 1}차 당해 입국: +{currentWaveEntryCount}명
                      </button>
                    ) : null}
                  />
                  
                  <StatCard title="향후 입국 예정" value={`${plannedCount}명`} subtitle={`${getWeekStr(currentWeek)} 이후 분`} icon={Clock} colorClass="bg-gradient-to-br from-blue-400 to-indigo-500" onClick={() => toggleFilter('planned')} isSelected={filterStatus === 'planned'} activeStatus={filterStatus !== null} />
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 sm:gap-8 mb-10">
                  <div className="xl:col-span-2 dx-glass rounded-[2rem] border border-slate-200 shadow-sm flex flex-col min-h-[500px] overflow-hidden">
                    <div className="p-6 sm:p-8 border-b border-slate-100 flex items-center justify-between bg-white/50 gap-4 flex-wrap">
                      <div className="flex items-center flex-wrap gap-3">
                        <div className="bg-slate-100 p-2.5 rounded-xl border border-slate-200 shrink-0"><Building2 size={24} className="text-slate-700" /></div>
                        <h3 className="text-lg sm:text-xl font-black text-slate-800 tracking-tight flex items-center flex-wrap gap-2">
                          부서 배치 대시보드
                          {filterStatus === 'completed' && allocationMode === 'predicted' && <span className="text-xs bg-cyan-50 text-cyan-700 px-2 py-1 rounded-lg border border-cyan-200 shadow-sm ml-2">매칭/입국 누적 기준</span>}
                          {filterStatus === 'planned' && allocationMode === 'predicted' && <span className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-lg border border-blue-200 shadow-sm ml-2">향후 입국 예정 기준</span>}
                          {filterStatus === 'current_wave' && allocationMode === 'predicted' && <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-lg border border-indigo-200 shadow-sm ml-2">{currentWaveIndex + 1}차 당해 입국 기준</span>}
                        </h3>
                      </div>
                      <div className="flex bg-slate-100/80 p-1.5 rounded-xl shrink-0 shadow-inner border border-slate-200/50">
                        <button onClick={() => setAllocationMode('predicted')} className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${allocationMode === 'predicted' ? 'bg-white text-slate-800 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700 hover:bg-white/50'}`}>예측 (공급계획)</button>
                        <button onClick={() => setAllocationMode('confirmed')} className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${allocationMode === 'confirmed' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-500 hover:text-slate-700 hover:bg-white/50'}`}>확정 (실제명단)</button>
                      </div>
                    </div>
                    <div className="p-5 sm:p-8 grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-3 gap-4 sm:gap-6 max-h-[650px] overflow-y-auto bg-slate-50/30 hide-scrollbar">

                        deptSummary.length === 0 ? (
                          <div className="col-span-full flex flex-col items-center justify-center text-slate-400 py-16"><Factory size={48} className="opacity-20 mb-4" /><p className="font-semibold">해당 조건의 부서 데이터가 없습니다.</p></div>
                        ) : (
                          deptSummary.map((dept, idx) => {
                            const displayTotal = filterStatus === 'completed' ? dept.totalArrived : 
                                                 filterStatus === 'planned' ? dept.totalPlanned : 
                                                 filterStatus === 'current_wave' ? dept.totalCurrentWave : 
                                                 dept.totalMatched;
                            
                            const labels = { completed: "입국완료", planned: "입국예정", current_wave: "당해입국", null: "매칭합계" };
                            const label = labels[String(filterStatus)];
                            
                            let barContent;
                            if (filterStatus === 'completed') {
                               barContent = <div className="bg-cyan-500 h-full transition-all duration-500" style={{ width: `${Math.min(100, (displayTotal / dept.totalReq) * 100)}%` }} title={`입국완료: ${displayTotal}명`}></div>;
                            } else if (filterStatus === 'planned') {
                               barContent = <div className="bg-blue-400 h-full transition-all duration-500" style={{ width: `${Math.min(100, (displayTotal / dept.totalReq) * 100)}%` }} title={`입국예정: ${displayTotal}명`}></div>;
                            } else if (filterStatus === 'current_wave') {
                               barContent = <div className="bg-indigo-500 h-full transition-all duration-500" style={{ width: `${Math.min(100, (displayTotal / dept.totalReq) * 100)}%` }} title={`당해입국: ${displayTotal}명`}></div>;
                            } else {
                               barContent = (
                                 <>
                                   <div className="bg-cyan-500 h-full transition-all duration-500" style={{ width: `${Math.min(100, (dept.totalArrived / dept.totalReq) * 100)}%` }} title={`입국완료: ${dept.totalArrived}명`}></div>
                                   <div className="bg-blue-300 h-full transition-all duration-500" style={{ width: `${Math.min(100, ((dept.totalMatched - dept.totalArrived) / dept.totalReq) * 100)}%` }} title={`입국예정: ${dept.totalMatched - dept.totalArrived}명`}></div>
                                 </>
                               );
                            }

                            return (
                              <div key={idx} onClick={() => setSelectedDept(dept.name)} className="bg-white border border-slate-200 rounded-2xl p-5 hover:border-cyan-400 hover:shadow-[0_10px_20px_-10px_rgba(6,182,212,0.3)] cursor-pointer transition-all flex flex-col relative group">
                                <div className="flex flex-wrap justify-between items-center mb-3 relative z-10 gap-x-2 gap-y-2">
                                  <h4 className="text-base sm:text-lg font-black text-slate-800 leading-normal whitespace-nowrap tracking-tight group-hover:text-cyan-700 transition-colors">
                                    {dept.name}
                                    <ChevronRight size={18} className="inline-block text-slate-300 ml-0.5 align-text-bottom group-hover:text-cyan-400 transition-colors" />
                                  </h4>
                                  <div className="flex items-baseline justify-end gap-1 whitespace-nowrap">
                                    <span className="text-2xl font-black text-slate-800 tracking-tighter leading-none group-hover:text-cyan-600 transition-colors">{displayTotal}</span>
                                    <span className="text-xs text-slate-400 font-bold ml-0.5">/ {dept.totalReq}명</span>
                                  </div>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-2.5 mb-2 flex overflow-hidden relative z-10 shadow-inner">
                                  {barContent}
                                </div>
                                <div className="flex justify-between text-[10px] sm:text-xs font-bold text-slate-400 mb-4 px-1">
                                  <span>{label} <span className={`ml-0.5 ${filterStatus === 'current_wave' ? 'text-indigo-600' : 'text-slate-800'}`}>{displayTotal}</span></span>
                                  <span>요청대비 {Math.min(100, Math.round((displayTotal / dept.totalReq) * 100)) || 0}%</span>
                                </div>
                                <div className="flex flex-wrap gap-2 relative z-10">
                                  {Object.entries(dept.jobs).map(([job, stats]) => {
                                    const jobDisplay = filterStatus === 'completed' ? stats.arr :

                                                       filterStatus === 'current_wave' ? stats.wave : 
                                                       stats.matched;
                                    return (
                                      <span key={job} className="text-[11px] font-bold bg-slate-50 text-slate-600 px-2.5 py-1 rounded-md border border-slate-100">
                                        {job} <span className="ml-1.5 text-slate-800 font-black">{jobDisplay}/{stats.req}</span>
                                      </span>
                                    );
                                  })}
                                </div>
                              </div>
                            )
                          })
                        )
                      ) : (
                        confirmedDeptSummary.length === 0 ? (
                          <div className="col-span-full flex flex-col items-center justify-center text-slate-400 py-16"><Factory size={48} className="opacity-20 mb-4" /><p className="font-semibold">해당 조건의 부서 데이터가 없습니다.</p></div>
                        ) : (
                          confirmedDeptSummary.map((dept, idx) => {
                            const arrivedPercent = Math.min(100, Math.round((dept.totalArrived / dept.totalReq) * 100)) || 0;
                            
                            return (
                              <div key={idx} onClick={() => setSelectedConfirmedDept({dept: dept.name, job: null})} className="bg-white border border-slate-200 rounded-2xl p-5 hover:border-slate-400 hover:shadow-[0_10px_20px_-10px_rgba(15,23,42,0.2)] cursor-pointer transition-all flex flex-col relative group">
                                <div className="flex flex-wrap justify-between items-center mb-3 relative z-10 gap-x-2 gap-y-2">
                                  <h4 className="text-base sm:text-lg font-black text-slate-800 leading-normal whitespace-nowrap tracking-tight group-hover:text-slate-900 transition-colors">
                                    {dept.name}
                                    <ChevronRight size={18} className="inline-block text-slate-300 ml-0.5 align-text-bottom group-hover:text-slate-500 transition-colors" />
                                  </h4>
                                  <div className="flex items-baseline justify-end gap-1 whitespace-nowrap">
                                    <span className="text-2xl font-black text-slate-800 tracking-tighter leading-none group-hover:text-black transition-colors">{dept.totalArrived}</span>
                                    <span className="text-xs text-slate-400 font-bold ml-0.5">/ {dept.totalReq}명</span>
                                  </div>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-2.5 mb-2 flex overflow-hidden relative z-10 shadow-inner">
                                  <div className="bg-slate-800 h-full transition-all duration-500" style={{ width: `${arrivedPercent}%` }} title={`입국완료: ${dept.totalArrived}명`}></div>
                                </div>
                                <div className="flex justify-between text-[10px] sm:text-xs font-bold text-slate-400 mb-4 px-1">
