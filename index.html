  <script type="text/babel">
    const { useState, useMemo, useEffect, createElement, forwardRef } = window.React;
    const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip: RechartsTooltip, Legend } = window.Recharts;
    
    const createLucideIcon = (iconName) => {
      return forwardRef(({ color = 'currentColor', size = 24, strokeWidth = 2, className = '', ...props }, ref) => {
        const iconNode = window.lucide?.icons[iconName];
        if (!iconNode || !Array.isArray(iconNode)) return null;

        const innerHTML = iconNode.map(child => {
            if (!Array.isArray(child)) return '';
            const tag = child[0];
            const attrs = child[1] || {};
            const attrsString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
            return `<${tag} ${attrsString}></${tag}>`;
        }).join('');

        return createElement('svg', {
          ref,
          xmlns: 'http://www.w3.org/2000/svg',
          width: size,
          height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: color,
          strokeWidth,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: `lucide lucide-${iconName} ${className}`,
          ...props,
          dangerouslySetInnerHTML: { __html: innerHTML }
        });
      });
    };

    const Ship = createLucideIcon('Ship');
    const Users = createLucideIcon('Users');
    const CheckCircle2 = createLucideIcon('CheckCircle2');
    const Clock = createLucideIcon('Clock');
    const Briefcase = createLucideIcon('Briefcase');
    const Building2 = createLucideIcon('Building2');
    const Building = createLucideIcon('Building');
    const CalendarClock = createLucideIcon('CalendarClock');
    const Factory = createLucideIcon('Factory');
    const ChevronRight = createLucideIcon('ChevronRight');
    const X = createLucideIcon('X');
    const Globe = createLucideIcon('Globe');
    const MapPin = createLucideIcon('MapPin');
    const Milestone = createLucideIcon('Milestone');
    const CheckSquare = createLucideIcon('CheckSquare');
    const BookOpen = createLucideIcon('BookOpen');
    const GraduationCap = createLucideIcon('GraduationCap');
    const PlaneLanding = createLucideIcon('PlaneLanding');
    const FileSpreadsheet = createLucideIcon('FileSpreadsheet');
    const Database = createLucideIcon('Database');
    const AlertCircle = createLucideIcon('AlertCircle');
    const UserX = createLucideIcon('UserX');
    const UserCheck = createLucideIcon('UserCheck');
    const Lock = createLucideIcon('Lock');
    const ShieldCheck = createLucideIcon('ShieldCheck');
    const PlayCircle = createLucideIcon('PlayCircle');
    const FileText = createLucideIcon('FileText');
    const Upload = createLucideIcon('Upload');
    const RefreshCw = createLucideIcon('RefreshCw');
    const Settings2 = createLucideIcon('Settings2');
    const Download = createLucideIcon('Download'); 

    // ==========================================
    // 1. DATA CONSTANTS
    // ==========================================
    const COLORS = ['#0284c7', '#06b6d4', '#0ea5e9', '#38bdf8', '#7dd3fc', '#bae6fd'];
    const MONTH_MAP_DISPLAY = { 1: 'JAN', 2: 'FEB', 3: 'MAR', 4: 'APR', 5: 'MAY', 6: 'JUN', 7: 'JUL', 8: 'AUG', 9: 'SEP', 10: 'OCT', 11: 'NOV', 12: 'DEC' };
    const WEEK_MAP = [
      {m:1, w:1}, {m:1, w:2}, {m:1, w:3}, {m:1, w:4}, {m:2, w:1}, {m:2, w:2}, {m:2, w:3}, {m:2, w:4}, {m:3, w:1}, {m:3, w:2}, {m:3, w:3}, {m:3, w:4}, {m:3, w:5}, {m:4, w:1}, {m:4, w:2}, {m:4, w:3}, {m:4, w:4}, {m:5, w:1}, {m:5, w:2}, {m:5, w:3}, {m:5, w:4}, {m:5, w:5}, {m:6, w:1}, {m:6, w:2}, {m:6, w:3}, {m:6, w:4}, {m:7, w:1}, {m:7, w:2}, {m:7, w:3}, {m:7, w:4}, {m:7, w:5}, {m:8, w:1}, {m:8, w:2}, {m:8, w:3}, {m:8, w:4}, {m:9, w:1}, {m:9, w:2}, {m:9, w:3}, {m:9, w:4}, {m:10, w:1}, {m:10, w:2}, {m:10, w:3}, {m:10, w:4}, {m:10, w:5}, {m:11, w:1}, {m:11, w:2}, {m:11, w:3}, {m:11, w:4}, {m:12, w:1}, {m:12, w:2}, {m:12, w:3}, {m:12, w:4}
    ];

    const DEPT_REQUEST_DB_DEFAULT = [
      { id: 1, dept: '대조', job: '용접', reqCount: 18, reqMonth: 3 },
      { id: 2, dept: '선행의장', job: '선각의장', reqCount: 35, reqMonth: 3 },
      { id: 3, dept: '대조', job: '선각취부', reqCount: 19, reqMonth: 6 },
      { id: 4, dept: '가공', job: '선각취부', reqCount: 14, reqMonth: 6 },
      { id: 5, dept: '가공', job: '용접', reqCount: 10, reqMonth: 6 }, 
      { id: 6, dept: '판넬', job: '용접', reqCount: 24, reqMonth: 6 },
      { id: 7, dept: '의장1', job: '의장취부', reqCount: 15, reqMonth: 6 },
      { id: 8, dept: '선행도장', job: '도장', reqCount: 29, reqMonth: 6 },
      { id: 9, dept: '커미셔닝', job: '전기', reqCount: 30, reqMonth: 6 }, 
    ];

    const AGENCY_SUPPLY_DB_DEFAULT = [
      { country: '베트남', track: '공공/협회', agency: 'Koshipa3', job: '용접', count: 40, supplyWeek: 31 }, 
      { country: '인도네시아', track: '공공/협회', agency: '조선협회', job: '선각의장', count: 29, supplyWeek: 26 }, 
      { country: '인도네시아', track: '민간 중개', agency: '코인파워', job: '용접', count: 18, supplyWeek: 17 }, 
      { country: '베트남', track: '민간 중개', agency: 'TM글로벌', job: '전기', count: 35, supplyWeek: 17 }, 
      { country: '베트남', track: '민간 중개', agency: '가나교역', job: '선각취부', count: 40, supplyWeek: 17 }, 
    ];

    const INDIVIDUAL_DB_DEFAULT = [
      { uid: 'H-01', name: 'BUI MINH DAI', dob: '950101', age: '31', country: '베트남', agency: '가나교역', job: '선각취부', preKrScore: 20, preChibuScore: 80, preWeldScore: '-', preTestWeek: 1, prePassWeek: 2, hasPreData: true, hasMainData: false }
    ];

    // ==========================================
    // 2. HELPER FUNCTIONS
    // ==========================================
    const getWeekStr = (w) => w <= 0 ? '2025년' : (w > 52 ? '2027년 이후' : (WEEK_MAP[w-1] ? `${WEEK_MAP[w-1].m}월 ${WEEK_MAP[w-1].w}주차` : ''));
    const getMonthStr = (w) => (w <= 0 || w > 52) ? '' : (WEEK_MAP[w-1] ? `${WEEK_MAP[w-1].m}월` : '');
    const isMonthStart = (w) => (w <= 0 || w > 52) ? false : (WEEK_MAP[w-1] && WEEK_MAP[w-1].w === 1);

    const getIsoWeek = (date) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    };

    const parseCSVText = (text) => {
      const result = [];
      let currentLine = [];
      let currentValue = '';
      let insideQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];
        if (char === '"') {
          if (insideQuotes && nextChar === '"') { currentValue += '"'; i++; } else { insideQuotes = !insideQuotes; }
        } else if (char === ',' && !insideQuotes) { currentLine.push(currentValue.trim()); currentValue = ''; }
        else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !insideQuotes) {
          if (char === '\r') i++; currentLine.push(currentValue.trim()); result.push(currentLine); currentLine = []; currentValue = '';
        } else { currentValue += char; }
      }
      if (currentValue !== '' || currentLine.length > 0) { currentLine.push(currentValue.trim()); result.push(currentLine); }
      return result;
    };

    const parseWeekInfo = (val) => {
      if (!val) return null;
      const rawStr = String(val).replace(/\s+/g, '');
      if (rawStr === '' || rawStr === '-') return null;
      if (rawStr.includes('탈락')) return '탈락';
      const dateMatch = rawStr.match(/(\d{2,4})[-\.\/](\d{1,2})[-\.\/](\d{1,2})/);
      if (dateMatch) {
          let year = parseInt(dateMatch[1]);
          if (year < 100) year += 2000;
          const month = parseInt(dateMatch[2]) - 1; 
          const day = parseInt(dateMatch[3]);
          let week = getIsoWeek(new Date(year, month, day));
          if (year < 2026) week = week - 52;
          else if (year > 2026) week = week + 52;
          return week;
      }
      const shortDateMatch = rawStr.match(/^(\d{1,2})[-\.\/](\d{1,2})$/);
      if (shortDateMatch) return getIsoWeek(new Date(2026, parseInt(shortDateMatch[1]) - 1, parseInt(shortDateMatch[2])));
      const numMatch = rawStr.match(/^(\d+)$/);
      if (numMatch) return Number(numMatch[1]);
      return null;
    };

    const parsePreRow = (cols, rowIndex) => {
      // 행에 데이터가 없거나 형식이 너무 짧은 경우에만 무시 (데이터 유실 방지 위해 느슨하게 검사)
      if (!cols || cols.length < 5) return null;
      const uid = cols[1] ? String(cols[1]).trim() : '';
      const name = cols[3] ? String(cols[3]).trim() : '';
      if (uid === '응시번호' || name === '성 명' || name === '이름') return null; // Header skip
      if (!uid && !name) return null; // Empty row skip
      
      const dob = cols[4] ? String(cols[4]).trim() : '';
      const job = cols[2] ? String(cols[2]).trim() : '';
      return {
          uid: uid || `N/A-pre-${rowIndex}`, job: job || '미지정', name, dob, age: cols[6] || '',
          isE9: cols[5] ? /[oO○]/.test(String(cols[5])) : false,
          preKrScore: String(cols[13] || '').replace(/[^0-9]/g, ''),
          preChibuScore: String(cols[17] || '').replace(/[^0-9]/g, ''),
          preWeldScore: String(cols[19] || '').replace(/[^0-9]/g, ''),
          country: cols[22] || '미지정', agency: cols[23] || '미지정',
          preTestWeek: parseWeekInfo(cols[24]), prePassWeek: parseWeekInfo(cols[25]), preDropWeek: parseWeekInfo(cols[26])
      };
    };

    const parseMainRow = (cols, rowIndex) => {
      // 본평가 데이터도 누락 없이 최대한 보존
      if (!cols || cols.length < 5) return null; 
      const uid = cols[1] ? String(cols[1]).trim() : '';
      const name = cols[3] ? String(cols[3]).trim() : '';
      if (uid === '응시번호' || name === '성 명' || name === '이름') return null;
      if (!uid && !name) return null;
      
      const dob = cols[4] ? String(cols[4]).trim() : '';
      const job = cols[2] ? String(cols[2]).trim() : '';
      return {
          uid: uid || `N/A-main-${rowIndex}`, job: job || '미지정', name, dob, age: cols[6] || '',
          isE9: cols[5] ? /[oO○]/.test(String(cols[5])) : false,
          country: cols[22] || '미지정', agency: cols[23] || '미지정',
          mainKrScore: String(cols[13] || '').replace(/[^0-9]/g, ''),
          mainChibuScore: String(cols[17] || '').replace(/[^0-9]/g, ''),
          mainWeldScore: String(cols[19] || '').replace(/[^0-9]/g, ''),
          mainTestWeek: parseWeekInfo(cols[24]), mainPassWeek: parseWeekInfo(cols[25]), mainDropWeek: parseWeekInfo(cols[26]),
          entryPassWeek: parseWeekInfo(cols[27]), entryDropWeek: parseWeekInfo(cols[28]),
          assignedDept: cols[30], videoUrl: cols[31], personalityTestUrl: cols[32]
      };
    };

    const getIndividualStatus = (ind, currentWeek) => {
        let st = { preTested: false, prePassed: false, preDropped: false, preWaiting: false, mainTested: false, mainPassed: false, mainDropped: false, mainWaiting: false, entryPassed: false, entryDropped: false, currentStage: '진행예정' };
        const isPast = (w) => w === '탈락' || (typeof w === 'number' && currentWeek >= w);
        
        // 데이터 존재 여부 파악
        const hasMain = ind.hasMainData;
        const hasPre = ind.hasPreData;
        const hasEntry = ind.entryPassWeek || ind.entryDropWeek;

        // 1. 사전평가 단계 (hasPreData가 있는 명단에 대해서만 판별)
        if (hasPre) {
            if (ind.preDropWeek && isPast(ind.preDropWeek)) { st.preTested = true; st.preDropped = true; }
            else if (ind.prePassWeek && isPast(ind.prePassWeek)) { st.preTested = true; st.prePassed = true; }
            else if (ind.preTestWeek && isPast(ind.preTestWeek)) { st.preTested = true; st.preWaiting = true; }
            else { st.preTested = true; st.preWaiting = true; } // 기본적으로 명단에 있으면 검증 대상(대기)
        }

        // [중요 수정] 강제 승급 로직 1: 본평가 명단에 진입했다면, 사전평가 탈락 이력은 무효화하고 합격/통과한 것으로 간주
        if (hasMain) {
            st.preTested = true;
            st.prePassed = true;
            st.preDropped = false;
            st.preWaiting = false;
        }

        // 2. 본평가 단계 (hasMainData가 있는 명단에 대해서만 판별)
        if (hasMain) {
            if (ind.mainDropWeek && isPast(ind.mainDropWeek)) { st.mainTested = true; st.mainDropped = true; }
            else if (ind.mainPassWeek && isPast(ind.mainPassWeek)) { st.mainTested = true; st.mainPassed = true; }
            else if (ind.mainTestWeek && isPast(ind.mainTestWeek)) { st.mainTested = true; st.mainWaiting = true; }
            else { st.mainTested = true; st.mainWaiting = true; } // 기본적으로 본평가 명단에 있으면 검증 대상(대기)
        }

        // [중요 수정] 강제 승급 로직 2: 입국 명단(입국일자/입국탈락)에 진입했다면, 본평가 탈락 이력 무효화
        if (hasEntry) { 
            st.mainTested = true; 
            st.mainPassed = true; 
            st.mainDropped = false; 
            st.mainWaiting = false; 
            st.preTested = true; 
            st.prePassed = true; 
            st.preDropped = false; 
            st.preWaiting = false; 
        }

        // 3. 입국 단계
        if (ind.entryDropWeek && isPast(ind.entryDropWeek)) st.entryDropped = true;
        else if (ind.entryPassWeek && isPast(ind.entryPassWeek)) st.entryPassed = true;

        // 최종 스테이지 결정 (현재 어디에 머물러 있는가)
        if (st.entryDropped || st.entryPassed) st.currentStage = '입국';
        else if (st.mainPassed) st.currentStage = '2차 육성(기량,한국어)';
        else if (st.mainDropped || st.mainWaiting) st.currentStage = '본기량검증완료';
        else if (st.prePassed) st.currentStage = '1차 육성(기량,한국어)';
        else if (st.preDropped || st.preWaiting) st.currentStage = '사전기량검증완료';
        else if (hasPre || hasMain) st.currentStage = '진행예정';

        return { stage: st.currentStage, isDropped: st.preDropped || st.mainDropped || st.entryDropped, ...st };
    };

    const assignDepartments = (individuals, requests) => {
      let needs = requests.map(r => ({ ...r, remaining: r.reqCount, assignedCountries: new Set(), assignedAgencies: new Set(), assignedWeeks: new Set() }));
      let inds = individuals.map(ind => ({...ind}));
      const availableDepts = [...new Set(needs.map(n => n.dept))].sort((a, b) => b.length - a.length);

      // Phase 1: 고정 할당
      inds.forEach(ind => {
        if (ind.assignedDept && ind.assignedDept.trim() !== '') {
          let assigned = ind.assignedDept.trim();
          if (!needs.some(n => n.dept === assigned)) {
            const matchedDept = availableDepts.find(dept => assigned.includes(dept));
            if (matchedDept) assigned = matchedDept;
          }
          let req = needs.find(n => n.dept === assigned && n.job === ind.job);
          if (req && req.remaining > 0) { 
            req.remaining--; 
            req.assignedCountries.add(ind.country); 
            req.assignedAgencies.add(ind.agency); 
            req.assignedWeeks.add(ind.entryPassWeek || 999);
          }
          ind.displayDept = assigned; ind.isDeptFixed = true;
        } else { ind.isDeptFixed = false; }
      });

      // Phase 2: 미확정 인원 스마트 배정 (동일일자+동일국가 최우선)
      const pendingInds = inds.filter(i => !i.isDeptFixed);
      const groups = {};
      pendingInds.forEach(ind => {
        const week = ind.entryPassWeek || 999;
        const key = `${ind.job}_${ind.country}_${ind.agency}_${week}`;
        if (!groups[key]) groups[key] = { job: ind.job, country: ind.country, agency: ind.agency, week: week, members: [] };
        groups[key].members.push(ind);
      });

      Object.values(groups).sort((a, b) => b.members.length - a.members.length).forEach(g => {
        let remainingToAssign = g.members.length;
        while (remainingToAssign > 0) {
          let validReqs = needs.filter(n => n.job === g.job && n.remaining > 0);
          if (validReqs.length === 0) break;
          validReqs.sort((a, b) => {
            const aHasC = a.assignedCountries.has(g.country); 
            const bHasC = b.assignedCountries.has(g.country);
            if (aHasC !== bHasC) return aHasC ? -1 : 1;
            
            const aCanTakeAll = a.remaining >= remainingToAssign;
            const bCanTakeAll = b.remaining >= remainingToAssign;
            if (aCanTakeAll !== bCanTakeAll) return aCanTakeAll ? -1 : 1;

            const diffA = Math.abs((g.week === 999 ? 52 : g.week) - a.reqMonth * 4.34);
            const diffB = Math.abs((g.week === 999 ? 52 : g.week) - b.reqMonth * 4.34);
            if (Math.abs(diffA - diffB) > 2) return diffA - diffB;
            
            return b.remaining - a.remaining;
          });
          let bestReq = validReqs[0];
          const assignCount = Math.min(remainingToAssign, bestReq.remaining);
          bestReq.assignedCountries.add(g.country); 
          bestReq.assignedAgencies.add(g.agency);
          bestReq.assignedWeeks.add(g.week);
          for (let i = 0; i < assignCount; i++) { const member = g.members.shift(); if (member) member.displayDept = bestReq.dept; }
          bestReq.remaining -= assignCount; remainingToAssign -= assignCount;
        }
      });

      inds.forEach(ind => { if (!ind.displayDept) ind.displayDept = (ind.entryPassWeek !== null && ind.entryPassWeek <= 0) ? '배치제외(25년입국)' : '대기(TBD)'; });
      return inds;
    };

    const autoAllocate = (requests, supplies) => {
      const demandPool = requests.map(r => ({ ...r, remaining: r.reqCount, fulfillments: [], assignedCountries: new Set(), assignedAgencies: new Set() }));
      const supplyPool = supplies.map(s => ({ ...s, remaining: s.count }));
      const availableDepts = [...new Set(demandPool.map(d => d.dept))].sort((a, b) => b.length - a.length);

      supplyPool.sort((a, b) => b.count - a.count);

      supplyPool.forEach(s => {
        if (s.fixedDept && s.fixedCount > 0) {
          let assigned = s.fixedDept.trim();
          if (!demandPool.some(d => d.dept === assigned)) {
            const matchedDept = availableDepts.find(dept => assigned.includes(dept));
            if (matchedDept) assigned = matchedDept;
          }
          let take = Math.min(s.remaining, s.fixedCount);
          let validDemands = demandPool.filter(d => d.dept === assigned && d.job === s.job);
          if (validDemands.length > 0) {
             let targetDemand = validDemands[0];
             targetDemand.fulfillments.push({ count: take, supplyWeek: s.supplyWeek, agency: s.agency, country: s.country, isFixed: true });
             targetDemand.assignedCountries.add(s.country); targetDemand.assignedAgencies.add(s.agency);
             s.remaining -= take; targetDemand.remaining -= take;
          } else {
             let newDemand = {
                id: demandPool.length + 1000, dept: assigned, job: s.job, reqCount: 0, reqMonth: s.supplyWeek ? Math.ceil(s.supplyWeek / 4.34) : 12,
                remaining: -take,
                fulfillments: [{ count: take, supplyWeek: s.supplyWeek, agency: s.agency, country: s.country, isFixed: true }],
                assignedCountries: new Set([s.country]), assignedAgencies: new Set([s.agency])
             };
             demandPool.push(newDemand);
             s.remaining -= take;
          }
        }
      });

      supplyPool.forEach(s => {
        while (s.remaining > 0) {
          let validDemands = demandPool.filter(d => d.job === s.job && d.remaining > 0);
          if (validDemands.length === 0) break;
          validDemands.sort((a, b) => {
            const aHasC = a.assignedCountries.has(s.country); 
            const bHasC = b.assignedCountries.has(s.country);
            if (aHasC !== bHasC) return aHasC ? -1 : 1;

            const aCanTakeAll = a.remaining >= s.remaining;
            const bCanTakeAll = b.remaining >= s.remaining;
            if (aCanTakeAll !== bCanTakeAll) return aCanTakeAll ? -1 : 1;

            const diffA = Math.abs((s.supplyWeek || 52) - a.reqMonth * 4.34);
            const diffB = Math.abs((s.supplyWeek || 52) - b.reqMonth * 4.34);
            if (Math.abs(diffA - diffB) > 2) return diffA - diffB;
            
            return b.remaining - a.remaining;
          });
          let targetDemand = validDemands[0];
          let take = Math.min(s.remaining, targetDemand.remaining);
          targetDemand.fulfillments.push({ count: take, supplyWeek: s.supplyWeek, agency: s.agency, country: s.country, isFixed: false });
          targetDemand.assignedCountries.add(s.country); targetDemand.assignedAgencies.add(s.agency);
          s.remaining -= take; targetDemand.remaining -= take;
        }
      });

      return demandPool.map(req => ({ ...req, fulfilledCount: req.reqCount - Math.max(0, req.remaining), unfulfilledCount: Math.max(0, req.remaining) })).sort((a, b) => a.id - b.id);
    };

    const getSheetId = (url) => {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : null;
    };

    // ==========================================
    // 3. UI COMPONENTS
    // ==========================================
    const StatCard = ({ title, value, subtitle, icon: Icon, colorClass, onClick, isSelected, activeStatus, badge }) => (
      <div onClick={onClick} className={`dx-glass p-6 sm:p-8 rounded-3xl transition-all duration-300 cursor-pointer flex items-center space-x-5 hover:-translate-y-1 hover:shadow-xl relative overflow-hidden group ${isSelected ? 'ring-2 ring-cyan-400 shadow-xl' : `border border-slate-200 shadow-sm ${activeStatus && !isSelected ? 'opacity-50 grayscale' : ''}`}`}>
        <div className="absolute -right-6 -top-6 opacity-[0.03] group-hover:opacity-10 transition-opacity transform group-hover:scale-110"><Icon size={120} /></div>
        <div className={`p-4 rounded-2xl ${colorClass} shadow-lg shrink-0 relative z-10`}><Icon size={28} className="text-white" /></div>
        <div className="flex flex-col justify-center min-w-0 relative z-10 flex-1">
          <div className="flex justify-between items-start mb-1 w-full gap-2">
            <h3 className="text-slate-500 text-sm font-bold tracking-tight truncate">{title}</h3>
            {badge && badge}
          </div>
          <div className="flex items-baseline space-x-2 flex-wrap">
            <span className="text-3xl font-black text-slate-800 tracking-tighter">{value}</span>
            <span className="text-xs font-semibold text-slate-400">{subtitle}</span>
          </div>
        </div>
      </div>
    );

    const ActualStagePipeline = ({ individuals, onStageClick, currentWeek }) => {
      const steps = [
        { key: "사전기량검증완료", icon: CheckSquare, color: "text-purple-600", bg: "bg-purple-100", border: "border-purple-300", tag: "1차 평가" },
        { key: "1차 육성(기량,한국어)", icon: BookOpen, color: "text-indigo-600", bg: "bg-indigo-100", border: "border-indigo-300", tag: "현지 교육" },
        { key: "본기량검증완료", icon: Milestone, color: "text-blue-600", bg: "bg-blue-100", border: "border-blue-300", tag: "최종 평가" },
        { key: "2차 육성(기량,한국어)", icon: GraduationCap, color: "text-teal-600", bg: "bg-teal-100", border: "border-teal-300", tag: "서류/비자" },
        { key: "입국", icon: PlaneLanding, color: "text-cyan-600", bg: "bg-cyan-100", border: "border-cyan-300", tag: "한국 도착" }
      ];

      const stats = { "사전기량검증완료": { waiting:0, passed:0, dropped:0 }, "1차 육성(기량,한국어)": { current:0 }, "본기량검증완료": { waiting:0, passed:0, dropped:0 }, "2차 육성(기량,한국어)": { current:0 }, "입국": { passed:0, dropped:0 } };
      
      // 고유 명단 개수 그대로 반영 (독립적 산출)
      let totalPreTested = individuals.filter(ind => ind.hasPreData).length;
      let totalMainTested = individuals.filter(ind => ind.hasMainData).length;

      individuals.forEach(ind => {
          const st = getIndividualStatus(ind, currentWeek);

          // 사전기량검증 대상
          if (st.preTested) {
            if (st.prePassed) stats["사전기량검증완료"].passed++;
            if (st.preDropped) stats["사전기량검증완료"].dropped++;
            if (st.preWaiting) stats["사전기량검증완료"].waiting++;
          }

          // 본기량검증 대상
          if (st.mainTested) {
            if (st.mainPassed) stats["본기량검증완료"].passed++;
            if (st.mainDropped) stats["본기량검증완료"].dropped++;
            if (st.mainWaiting) stats["본기량검증완료"].waiting++;
          }

          if (st.entryPassed) stats["입국"].passed++;
          if (st.entryDropped) stats["입국"].dropped++;

          // 현재 체류 단계
          if (st.currentStage === '1차 육성(기량,한국어)') stats["1차 육성(기량,한국어)"].current++;
          if (st.currentStage === '2차 육성(기량,한국어)') stats["2차 육성(기량,한국어)"].current++;
      });

      return (
        <div className="dx-glass p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm mb-8 sm:mb-10 relative overflow-hidden">
          <div className="absolute -right-10 -top-10 text-slate-400 opacity-[0.03] pointer-events-none">
            <Users size={250} />
          </div>
          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-8 gap-4 relative z-10 border-b border-slate-100 pb-4">
            <div>
              <h3 className="text-base sm:text-lg font-black text-slate-800 flex items-center tracking-tight break-keep">
                <FileSpreadsheet size={20} className="mr-2 text-cyan-600 shrink-0"/> 
                단계별 수급 진행 현황
                </h3>
              <p className="text-xs sm:text-sm text-slate-500 font-medium mt-1.5">
                선택한 타임라인 주차(<strong className="text-cyan-600 font-extrabold">{getWeekStr(currentWeek)}</strong>)를 기준으로 누적된 각 단계별 인원 현황입니다.
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <div className="text-xs sm:text-sm font-bold text-slate-600 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm flex items-center">
                <CheckSquare size={14} className="mr-1.5 text-purple-500" />
                사전기량검증 대상: <span className="text-slate-800 font-black ml-1">{totalPreTested}명</span>
              </div>
              <div className="text-xs sm:text-sm font-bold text-slate-600 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm flex items-center">
                <Milestone size={14} className="mr-1.5 text-blue-500" />
                본기량검증 대상: <span className="text-slate-800 font-black ml-1">{totalMainTested}명</span>
              </div>
            </div>
          </div>
          
          <div className="flex flex-row items-stretch w-full relative pt-6 pb-6 overflow-x-auto snap-x hide-scrollbar">
            <div className="hidden md:block absolute top-[40%] left-0 w-full h-1.5 bg-slate-100 -translate-y-1/2 z-0 mt-[-12px] rounded-full"></div>
            {steps.map((step, idx) => {
              const isTest = ['사전기량검증완료', '본기량검증완료'].includes(step.key);
              const isEntry = step.key === '입국';
              const s = stats[step.key];
              
              let bigNumber = 0;
              let bigLabel = '';
              let mainViewType = '';

              if (isTest) {
                 bigNumber = s.waiting;
                 bigLabel = '결과 대기';
                 mainViewType = 'waiting';
              } else if (isEntry) {
                 bigNumber = s.passed;
                 bigLabel = '입국 완료';
                 mainViewType = 'passed';
              } else {
                 bigNumber = s.current;
                 bigLabel = '체류(교육중)';
                 mainViewType = 'current';
              }

              return (
                <div key={idx} onClick={() => onStageClick(step.key, mainViewType)} 
                     className={`flex flex-col items-center relative z-10 flex-shrink-0 w-[140px] md:w-1/5 snap-center transition-transform duration-300 cursor-pointer hover:-translate-y-2 group`}>
                  <div className={`absolute -top-5 text-xs font-black px-3 py-1 rounded-full bg-white border ${step.color} ${step.border} shadow-sm z-20 whitespace-nowrap group-hover:bg-slate-50 transition-colors`}>{step.tag}</div>
                  <div className={`w-16 h-16 sm:w-20 sm:h-20 rounded-full ${step.bg} ${step.color} flex items-center justify-center border-[4px] border-white shadow-lg mb-3 sm:mb-4 ring-2 ${step.border} mt-2 transition-all shrink-0 relative`}>
                    <step.icon size={28} className="sm:w-8 sm:h-8 relative z-10" />
                    <div className={`absolute inset-0 rounded-full opacity-0 group-hover:opacity-50 blur-md transition-opacity duration-500 bg-current`}></div>
                  </div>
                  <span className="text-sm sm:text-base font-bold text-slate-500 text-center mb-1 px-1 leading-normal break-keep flex items-center justify-center tracking-tight">{step.key}</span>
                  
                  <div className="flex flex-col items-center">
                     <span className={`text-2xl sm:text-3xl font-black transition-colors tracking-tighter ${bigNumber > 0 ? 'text-slate-800' : 'text-slate-300'}`}>{bigNumber}명</span>
                     <span className="text-[10px] text-cyan-600 font-bold">{bigLabel}</span>
                  </div>
                  
                  {isTest && (
                     <div className="flex gap-1.5 mt-2 flex-wrap justify-center">
                        <div onClick={(e) => { e.stopPropagation(); if(s.dropped > 0) onStageClick(step.key, 'dropped'); }} 
                             className={`text-[10px] sm:text-[11px] font-bold px-2 py-1 rounded-lg flex items-center shadow-sm transition-all duration-300 ${s.dropped > 0 ? 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 hover:shadow-md cursor-pointer' : 'bg-slate-50 border border-slate-100 text-slate-400'}`}>
                          <UserX size={10} className="mr-1" /> 탈락 {s.dropped}
                        </div>
                        {s.passed > 0 && (
                           <div onClick={(e) => { e.stopPropagation(); onStageClick(step.key, 'passed'); }} 
                                className="text-[10px] sm:text-[11px] font-bold px-2 py-1 rounded-lg bg-indigo-50 text-indigo-600 shadow-sm border border-indigo-200 flex items-center cursor-pointer hover:bg-indigo-100 hover:shadow-md">
                             <CheckCircle2 size={10} className="mr-1" /> 누적합격 {s.passed}
                           </div>
                        )}
                     </div>
                  )}
                  {isEntry && (
                     <div className="flex gap-1.5 mt-2 flex-wrap justify-center">
                        <div onClick={(e) => { e.stopPropagation(); if(s.dropped > 0) onStageClick(step.key, 'dropped'); }} 
                             className={`text-[10px] sm:text-[11px] font-bold px-2 py-1 rounded-lg flex items-center shadow-sm transition-all duration-300 ${s.dropped > 0 ? 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 hover:shadow-md cursor-pointer' : 'bg-slate-50 border border-slate-100 text-slate-400'}`}>
                          <UserX size={10} className="mr-1" /> 탈락 {s.dropped}
                        </div>
                     </div>
                  )}
                  {!isTest && !isEntry && (
                     <div className="mt-2 text-[10px] sm:text-[11px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-lg border border-slate-200 shadow-sm">
                        해당 단계 체류중
                     </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const IndividualDetailModal = ({ isOpen, onClose, stage, viewType, individuals, currentWeek, authRole }) => {
      const [sortConfig, setSortConfig] = window.React.useState({ key: 'uid', direction: 'asc' });

      window.React.useEffect(() => {
        setSortConfig({ key: 'uid', direction: 'asc' });
      }, [stage, viewType]);

      const filteredIndividuals = window.React.useMemo(() => {
          if (!isOpen || !stage) return [];
          return individuals.filter(ind => {
              const st = getIndividualStatus(ind, currentWeek);
              
              if (viewType === 'dropped') {
                  if (stage === '사전기량검증완료') return st.preDropped;
                  if (stage === '본기량검증완료') return st.mainDropped;
                  if (stage === '입국') return st.entryDropped;
              } else if (viewType === 'waiting') {
                  if (stage === '사전기량검증완료') return st.preWaiting;
                  if (stage === '본기량검증완료') return st.mainWaiting;
              } else if (viewType === 'passed') {
                  if (stage === '사전기량검증완료') return st.prePassed;
                  if (stage === '본기량검증완료') return st.mainPassed;
                  if (stage === '입국') return st.entryPassed;
              } else if (viewType === 'current') {
                  if (stage === '1차 육성(기량,한국어)') return st.currentStage === '1차 육성(기량,한국어)';
                  if (stage === '2차 육성(기량,한국어)') return st.currentStage === '2차 육성(기량,한국어)';
              }
              return false;
          });
      }, [isOpen, stage, viewType, individuals, currentWeek]);

      const sortedIndividuals = window.React.useMemo(() => {
        if (!isOpen || !stage) return [];
        let sortable = [...filteredIndividuals];
        if (sortConfig.key) {
          sortable.sort((a, b) => {
            let aVal = a[sortConfig.key];
            let bVal = b[sortConfig.key];

            if (['preChibuScore', 'preWeldScore', 'preKrScore', 'mainChibuScore', 'mainWeldScore', 'mainKrScore', 'age'].includes(sortConfig.key)) {
              aVal = Number(aVal) || 0;
              bVal = Number(bVal) || 0;
            } else {
              aVal = String(aVal || '');
              bVal = String(bVal || '');
            }

            if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
        return sortable;
      }, [isOpen, stage, filteredIndividuals, sortConfig]);

      const requestSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };

      const SortIcon = ({ columnKey }) => {
        if (sortConfig.key !== columnKey) return <span className="opacity-30 ml-1 text-[10px]">↕</span>;
        return sortConfig.direction === 'asc' ? <span className="text-cyan-500 ml-1 font-black text-[10px]">↑</span> : <span className="text-cyan-500 ml-1 font-black text-[10px]">↓</span>;
      };

      const handleDownloadExcel = () => {
        const headers = [
          "응시번호", "직무", "성명", "생년월일", "E-9여부", "나이",
          "한국어점수", "취부점수", "용접점수",
          "국가"
        ];
        if (authRole !== 'production') {
            headers.push("송출업체");
        }
        headers.push(
          "본평가일자(주차)", "본기량합격(주차)", "본기량탈락(주차)",
          "입국일자(주차)", "입국탈락(주차)",
          "배치부서", "영상URL", "인성검사URL"
        );

        const rows = sortedIndividuals.map(ind => {
            const row = [
              ind.uid || '',
              ind.job || '',
              ind.name || '',
              ind.dob || '',
              ind.isE9 ? 'O' : 'X',
              ind.age || '',
              ind.mainKrScore || '',
              ind.mainChibuScore || '',
              ind.mainWeldScore || '',
              ind.country || ''
            ];
            if (authRole !== 'production') {
                row.push(ind.agency || '');
            }
            row.push(
              ind.mainTestWeek ? `${ind.mainTestWeek}주차` : '',
              ind.mainPassWeek ? `${ind.mainPassWeek}주차` : '',
              ind.mainDropWeek ? `${ind.mainDropWeek}주차` : '',
              ind.entryPassWeek ? `${ind.entryPassWeek}주차` : '',
              ind.entryDropWeek ? `${ind.entryDropWeek}주차` : '',
              ind.isDeptFixed ? ind.displayDept : '대기',
              ind.videoUrl || '',
              ind.personalityTestUrl || ''
            );
            return row;
        });

        const csvContent = [
          headers.join(","),
          ...rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
        ].join("\n");

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${stage}_명단.csv`;
        link.click();
      };

      const isPreArea = stage ? ['사전기량검증완료', '1차 육성(기량,한국어)'].includes(stage) : false;
      const isMainStage = stage ? ['본기량검증완료', '2차 육성(기량,한국어)', '입국'].includes(stage) : false;
      const showExtraColumns = isMainStage;
      
      let themeGradient = 'bg-gradient-to-r from-slate-800 to-slate-700';
      if (viewType === 'dropped') themeGradient = 'bg-gradient-to-r from-red-700 to-rose-700';
      else if (viewType === 'waiting') themeGradient = 'bg-gradient-to-r from-amber-600 to-orange-500';
      else if (stage === '사전기량검증완료') themeGradient = 'bg-gradient-to-r from-purple-700 to-fuchsia-700';
      else if (stage === '1차 육성(기량,한국어)') themeGradient = 'bg-gradient-to-r from-indigo-700 to-blue-700';
      else if (stage === '본기량검증완료') themeGradient = 'bg-gradient-to-r from-blue-700 to-cyan-700';
      else if (stage === '2차 육성(기량,한국어)') themeGradient = 'bg-gradient-to-r from-teal-700 to-emerald-700';
      else if (stage === '입국') themeGradient = 'bg-gradient-to-r from-cyan-600 to-teal-600';

      let titleLabel = '진행(완료)';
      if (viewType === 'dropped') titleLabel = '탈락자';
      else if (viewType === 'waiting') titleLabel = '결과 대기';
      else if (viewType === 'passed') titleLabel = '합격(완료)';
      else if (viewType === 'current') titleLabel = '체류(교육중)';

      return isOpen && stage ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-4 sm:p-6 animate-in fade-in duration-200">
          <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-7xl overflow-hidden animate-in zoom-in-95 duration-300 max-h-[90vh] flex flex-col border border-slate-200/50">
            <div className={`p-6 sm:p-8 flex justify-between items-center ${themeGradient} text-white shrink-0 gap-4 shadow-md`}>
              <div className="flex items-center space-x-4 sm:space-x-5 min-w-0">
                <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm shadow-inner shrink-0">
                  {viewType === 'dropped' ? <UserX size={28} className="sm:w-8 sm:h-8" /> : (viewType === 'waiting' ? <Clock size={28} className="sm:w-8 sm:h-8" /> : <UserCheck size={28} className="sm:w-8 sm:h-8" />)}
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black tracking-tight truncate break-keep text-white drop-shadow-md">
                    [{stage}] {titleLabel} 명단
                  </h2>
                  <p className="text-xs sm:text-sm font-medium text-white/80 mt-1 whitespace-nowrap">
                    타임라인 기준: {getWeekStr(currentWeek)}
                  </p>
                </div>
                <div className="hidden sm:flex ml-4 shrink-0 items-center gap-2">
                  <span className="bg-black/30 backdrop-blur-md px-4 py-1.5 rounded-full text-sm font-bold shadow-inner border border-white/10">
                    총 인원: {filteredIndividuals.length}명
                  </span>
                  {(stage === '2차 육성(기량,한국어)' || stage === '입국') && (
                    <button 
                      onClick={handleDownloadExcel}
                      className="flex items-center bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-md transition-colors border border-emerald-600"
                    >
                      <Download size={14} className="mr-1.5" /> 엑셀 다운로드
                    </button>
                  )}
                </div>
              </div>
              <button onClick={onClose} className="text-white/70 hover:text-white p-2 rounded-full hover:bg-black/20 transition-all shrink-0 bg-black/10 border border-white/10"><X size={24} /></button>
            </div>
            <div className="p-0 sm:p-6 overflow-y-auto flex-1 bg-slate-50/50">
              {filteredIndividuals.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                  <Users size={64} className="mb-4 opacity-20" />
                  <p className="font-bold text-lg">해당 조건에 일치하는 명단이 없습니다.</p>
                </div>
              ) : (
                <div className="overflow-x-auto sm:rounded-2xl border border-slate-200/60 bg-white shadow-sm">
                  <table className={`w-full text-center border-collapse ${isMainStage ? 'min-w-[1000px]' : 'min-w-[750px]'}`}>
                    <thead className="bg-slate-100/80 text-slate-600 text-xs sm:text-sm border-b border-slate-200">
                      <tr>
                        <th className="p-2 sm:p-3 font-black align-middle text-center w-10 border-r border-slate-200">No.</th>
                        <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200 cursor-pointer hover:bg-slate-200/50 transition-colors" onClick={() => requestSort('uid')}>
                          <div className="flex items-center justify-center">응시번호 (성명) <SortIcon columnKey="uid" /></div>
                        </th>
                        <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200 cursor-pointer hover:bg-slate-200/50 transition-colors" onClick={() => requestSort('age')}>
                          <div className="flex items-center justify-center">나이 <SortIcon columnKey="age" /></div>
                        </th>
                        <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200 cursor-pointer hover:bg-slate-200/50 transition-colors" onClick={() => requestSort('country')}>
                          <div className="flex items-center justify-center">{authRole === 'production' ? '국가' : '국가 / 업체명'} <SortIcon columnKey="country" /></div>
                        </th>
                        <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200 cursor-pointer hover:bg-slate-200/50 transition-colors" onClick={() => requestSort('job')}>
                          <div className="flex items-center justify-center">직무 / <span className="text-cyan-600 ml-1">배치부서</span> <SortIcon columnKey="job" /></div>
                        </th>
                        
                        <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200 bg-purple-50/50">
                          <div className="text-purple-800">{isPreArea ? '사전기량' : '본기량'} 상세 점수</div>
                          <div className="text-[10px] font-bold text-purple-500 mt-0.5 flex justify-center gap-3">
                            <span className="cursor-pointer hover:text-purple-700 flex items-center" onClick={() => requestSort(isPreArea ? 'preChibuScore' : 'mainChibuScore')}>취부<SortIcon columnKey={isPreArea ? 'preChibuScore' : 'mainChibuScore'} /></span>
                            <span>/</span>
                            <span className="cursor-pointer hover:text-purple-700 flex items-center" onClick={() => requestSort(isPreArea ? 'preWeldScore' : 'mainWeldScore')}>용접<SortIcon columnKey={isPreArea ? 'preWeldScore' : 'mainWeldScore'} /></span>
                            <span>/</span>
                            <span className="cursor-pointer hover:text-purple-700 flex items-center" onClick={() => requestSort(isPreArea ? 'preKrScore' : 'mainKrScore')}>한국어<SortIcon columnKey={isPreArea ? 'preKrScore' : 'mainKrScore'} /></span>
                          </div>
                        </th>
                        
                        {showExtraColumns && (
                          <th className="p-2 sm:p-3 font-black align-middle text-center border-r border-slate-200">
                            첨부 (영상/인성)
                            <div className="mt-1.5 flex justify-center">
                              <a 
                                href="https://drive.google.com/file/d/1JvxYQqmevHsnp7CWW200Oup50j64sZWR/view?usp=sharing" 
                                target="_blank" 
                                rel="noopener noreferrer" 
                                onClick={(e) => e.stopPropagation()}
                                className="inline-flex items-center bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:text-indigo-900 border border-indigo-200 px-2 py-1 rounded text-[10px] font-bold shadow-sm transition-colors cursor-pointer whitespace-nowrap"
                              >
                                <BookOpen size={10} className="mr-1" /> 인성검사설명서
                              </a>
                            </div>
                          </th>
                        )}
                        <th className="p-2 sm:p-3 font-black align-middle text-center">진행 상태</th>
                      </tr>
                    </thead>
                    <tbody className="text-[13px] sm:text-sm font-medium">
                      {sortedIndividuals.map((ind, idx) => {
                        const status = getIndividualStatus(ind, currentWeek);
                        const scores = isPreArea ? { c: ind.preChibuScore, w: ind.preWeldScore, k: ind.preKrScore } : { c: ind.mainChibuScore, w: ind.mainWeldScore, k: ind.mainKrScore };
                        return (
                          <tr key={idx} className={`border-b border-slate-100 hover:bg-slate-50 transition-colors ${status.isDropped ? 'bg-red-50/30' : ''}`}>
                            <td className="p-2 sm:p-3 text-slate-400 align-middle text-center font-bold border-r border-slate-100">{idx + 1}</td>
                            <td className="p-2 sm:p-3 text-slate-800 align-middle border-r border-slate-100">
                              <div className="flex items-center justify-start gap-2 pl-2 sm:pl-6">
                                <span className="font-mono text-[10px] sm:text-[11px] font-black text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 shadow-sm shrink-0">{ind.uid}</span>
                                <span className="font-bold text-xs sm:text-sm whitespace-nowrap tracking-tight text-slate-800">{ind.name || '이름없음'}</span>
                                {ind.isE9 && <span className="bg-amber-100 text-amber-700 text-[9px] px-1.5 py-0.5 rounded font-black border border-amber-200 shadow-sm flex items-center shrink-0"><ShieldCheck size={10} className="mr-0.5"/>E-9</span>}
                              </div>
                            </td>
                            <td className="p-2 sm:p-3 align-middle text-center border-r border-slate-100 whitespace-nowrap">
                              <span className="font-bold text-slate-700 text-xs">{ind.age ? `${ind.age}세` : '-'}</span>
                            </td>
                            <td className="p-2 sm:p-3 align-middle text-center border-r border-slate-100">
                              <div className="flex items-center justify-center space-x-1 mb-1">
                                <MapPin size={12} className={ind.country === '베트남' ? 'text-rose-500' : 'text-cyan-500'} />
                                <span className="font-bold text-slate-700 text-xs">{ind.country}</span>
                              </div>
                              {authRole !== 'production' && (
                                <div className="text-[10px] text-slate-500 font-semibold">{ind.agency} <span className="font-normal text-slate-400">({ind.track})</span></div>
                              )}
                            </td>
                            
                            <td className="p-2 sm:p-3 text-slate-700 align-middle text-center border-r border-slate-100 whitespace-nowrap">
                              <div className="font-extrabold mb-1 text-xs">{ind.job}</div>
                              <div className={`text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded inline-flex justify-center items-center ${ind.isDeptFixed ? 'bg-cyan-50 text-cyan-700 border border-cyan-200 shadow-sm' : 'bg-slate-100 text-slate-500 border border-slate-200'}`}>
                                {ind.isDeptFixed ? `${ind.displayDept} (확정)` : '대기'}
                              </div>
                            </td>
                            
                            <td className="p-2 sm:p-3 align-middle text-center border-r border-slate-100 bg-blue-50/10">
                                <div className="flex items-center justify-center gap-2 sm:gap-3">
                                  <div className="flex flex-col items-center w-7 sm:w-8">
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 font-bold mb-0.5">취부</span>
                                    <span className={`font-black tracking-tighter ${Number(scores.c) >= 80 ? 'text-cyan-600 text-base' : 'text-slate-600 text-sm'}`}>{scores.c || '-'}</span>
                                  </div>
                                  <div className="w-px h-5 bg-slate-200"></div>
                                  <div className="flex flex-col items-center w-7 sm:w-8">
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 font-bold mb-0.5">용접</span>
                                    <span className={`font-black tracking-tighter ${Number(scores.w) >= 80 ? 'text-cyan-600 text-base' : 'text-slate-600 text-sm'}`}>{scores.w || '-'}</span>
                                  </div>
                                  <div className="w-px h-5 bg-slate-200"></div>
                                  <div className="flex flex-col items-center w-7 sm:w-8">
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 font-bold mb-0.5">한국어</span>
                                    <span className={`font-black tracking-tighter ${Number(scores.k) >= 15 ? 'text-emerald-500 text-base' : 'text-slate-600 text-sm'}`}>{scores.k || '-'}</span>
                                  </div>
                                </div>
                            </td>

                            {showExtraColumns && (
                              <td className="p-2 sm:p-3 align-middle text-center border-r border-slate-100">
                                 <div className="flex flex-row gap-1.5 items-center justify-center">
                                    {ind.videoUrl ? (
                                      <a 
                                        href={ind.videoUrl.startsWith('http') ? ind.videoUrl : `https://${ind.videoUrl}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        onClick={(e) => e.stopPropagation()}
                                        className="inline-flex items-center justify-center px-2 py-1 bg-slate-800 text-white border border-slate-700 rounded text-[10px] sm:text-[11px] font-bold hover:bg-black transition-all shadow-sm active:scale-95 whitespace-nowrap"
                                      >
                                        <PlayCircle size={12} className="mr-1 text-cyan-400" /> 영상
                                      </a>
                                    ) : (
                                      <span className="inline-flex items-center justify-center px-2 py-1 bg-slate-50 text-slate-300 border border-slate-100 rounded text-[10px] sm:text-[11px] font-bold whitespace-nowrap">-</span>
                                    )}
                                    {ind.personalityTestUrl ? (
                                      <a 
                                        href={ind.personalityTestUrl.startsWith('http') ? ind.personalityTestUrl : `https://${ind.personalityTestUrl}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        onClick={(e) => e.stopPropagation()}
                                        className="inline-flex items-center justify-center px-2 py-1 bg-white text-slate-700 border border-slate-300 rounded text-[10px] sm:text-[11px] font-bold hover:border-cyan-400 hover:text-cyan-700 transition-all shadow-sm active:scale-95 whitespace-nowrap"
                                      >
                                        <FileText size={12} className="mr-1 text-cyan-600" /> 인성
                                      </a>
                                    ) : (
                                      <span className="inline-flex items-center justify-center px-2 py-1 bg-slate-50 text-slate-300 border border-slate-100 rounded text-[10px] sm:text-[11px] font-bold whitespace-nowrap">-</span>
                                    )}
                                 </div>
                              </td>
                            )}

                            <td className="p-2 sm:p-3 align-middle text-center whitespace-nowrap">
                              {status.isDropped ? (
                                <span className="inline-flex items-center bg-rose-50 text-rose-700 px-2 py-1 rounded text-[11px] sm:text-xs font-bold border border-rose-200 shadow-sm">
                                  <UserX size={14} className="mr-1" /> 탈락
                                </span>
                              ) : status.stage === '입국' ? (
                                <span className="inline-flex items-center bg-cyan-50 text-cyan-700 px-2 py-1 rounded text-[11px] sm:text-xs font-bold border border-cyan-200 shadow-sm">
                                  <CheckCircle2 size={14} className="mr-1" /> 완료
                                </span>
                              ) : (
                                <span className="inline-flex items-center bg-slate-100 text-slate-700 px-2 py-1 rounded text-[11px] sm:text-xs font-bold border border-slate-200 shadow-sm">
                                  <CheckCircle2 size={14} className="mr-1" /> 진행 ({status.stage})
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        </div>
      ) : null;
    };

    const DeptModal = ({ isOpen, onClose, dept, data, currentWeek, filterStatus, authRole }) => {
      if (!isOpen || !dept) return null;
      const totalReq = data.reduce((sum, item) => sum + item.reqCount, 0);
      
      let statusLabel = '매칭 합계';
      if (filterStatus === 'completed') statusLabel = '입국 완료';
      else if (filterStatus === 'planned') statusLabel = '입국 예정';
      else if (filterStatus === 'current_wave') statusLabel = '당해 입국';

      return isOpen && dept ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-4 sm:p-6 animate-in fade-in duration-200">
          <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-5xl overflow-hidden animate-in zoom-in-95 duration-300 max-h-[90vh] flex flex-col border border-slate-200">
            <div className="bg-gradient-to-r from-slate-900 to-blue-900 p-6 sm:p-8 flex justify-between items-center text-white shrink-0 gap-4 shadow-md">
              <div className="flex items-center space-x-4 min-w-0">
                <div className="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/10 shadow-inner shrink-0">
                  <Factory size={28} className="text-cyan-400" />
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black truncate break-keep tracking-tight text-white drop-shadow-sm">{dept} 부서 상세 매칭 (예측)</h2>
                </div>
                <span className="hidden sm:inline-flex items-center bg-cyan-500/20 border border-cyan-400/50 text-cyan-50 px-4 py-1.5 rounded-full text-sm sm:text-base font-bold shadow-inner whitespace-nowrap ml-2 backdrop-blur-md">
                  총 요청: {totalReq}명
                </span>
              </div>
              <button onClick={onClose} className="text-white/70 hover:text-white p-2 rounded-full hover:bg-white/10 transition-all shrink-0 bg-white/5 border border-white/10"><X size={24} /></button>
            </div>
            <div className="p-5 sm:p-8 overflow-y-auto flex-1 bg-slate-50/50">
              <div className="overflow-x-auto rounded-2xl border border-slate-200/60 bg-white shadow-sm">
                <table className="w-full text-center border-collapse min-w-[750px]">
                  <thead className="bg-slate-100/80 text-slate-600 text-sm sm:text-base border-b border-slate-200">
                    <tr>
                      <th className="p-4 sm:p-5 font-black break-keep w-1/4 align-middle text-center">투입 직무 (요청월)</th>
                      <th className="p-4 sm:p-5 font-black break-keep w-1/6 align-middle text-center">요청 인원</th>
                      <th className="p-4 sm:p-5 font-black pl-8 break-keep w-2/5 align-middle text-center">자동 매칭 결과 ({statusLabel})</th>
                      <th className="p-4 sm:p-5 font-black break-keep w-1/6 align-middle text-center leading-tight">
                        진행 상태<br/>
                        <span className="text-xs font-semibold text-slate-400 tracking-tight">({getWeekStr(currentWeek)} 기준)</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody className="text-sm sm:text-base">
                    {data.map((item, idx) => {
                      const arrivedCount = item.fulfillments.filter(f => f.supplyWeek !== null && f.supplyWeek <= currentWeek).reduce((sum, f) => sum + f.count, 0);
                      const isFullyArrived = arrivedCount >= item.reqCount && item.reqCount > 0;

                      const filteredFulfillments = item.fulfillments.filter(f => {
                        if (filterStatus === 'completed') return f.supplyWeek !== null && f.supplyWeek <= currentWeek;
                        if (filterStatus === 'planned') return f.supplyWeek === null || f.supplyWeek > currentWeek;
                        if (filterStatus === 'current_wave') return f.supplyWeek === currentWeek;
                        return true;
                      });

                      if (filterStatus !== null && filteredFulfillments.length === 0) return null;

                      return (
                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                          <td className="p-4 sm:p-5 text-slate-800 font-extrabold break-keep align-middle">
                            <div className="flex items-center justify-center space-x-3">
                              <Briefcase size={20} className="text-cyan-600 shrink-0" />
                              <span className="text-base sm:text-lg whitespace-nowrap">{item.job} <span className="text-slate-400 font-semibold ml-1 whitespace-nowrap">({item.reqMonth}월)</span></span>
                            </div>
                          </td>
                          <td className="p-4 sm:p-5 text-slate-800 font-black text-xl sm:text-2xl whitespace-nowrap align-middle text-center tracking-tighter">{item.reqCount}명</td>
                          <td className="p-4 sm:p-5 align-middle text-center">
                            {filteredFulfillments.length === 0 ? (
                              <span className="text-slate-500 font-semibold bg-slate-100 px-3 py-1.5 rounded-lg break-keep shadow-sm border border-slate-200">해당 인원 없음</span>
                            ) : (
                              <div className="space-y-2 flex flex-col items-center">
                                {filteredFulfillments.map((f, fIdx) => (
                                  <div key={fIdx} className={`flex items-center justify-center flex-wrap gap-2 font-bold px-3 py-2 rounded-xl border shadow-sm ${f.supplyWeek !== null && f.supplyWeek <= currentWeek ? 'bg-cyan-50 border-cyan-200 text-cyan-900' : 'bg-white border-slate-200 text-slate-700'}`}>
                                    <span className={`font-black whitespace-nowrap ${f.supplyWeek !== null && f.supplyWeek <= currentWeek ? 'text-cyan-700' : 'text-slate-600'}`}>{f.supplyWeek ? getWeekStr(f.supplyWeek) : '입국주차 미정'}</span> 
                                    <span className="text-slate-300 mx-1">➔</span>
                                    <span className="text-base whitespace-nowrap font-black">{f.count}명</span>
                                    {f.isFixed && <span className="text-[10px] bg-slate-800 text-white px-1.5 py-0.5 rounded border border-slate-700 font-bold whitespace-nowrap shadow-sm">배치확정</span>}
                                    <span className="flex items-center text-xs bg-white/80 py-1 px-2 rounded-lg text-slate-600 border border-slate-200/60 break-keep ml-2 shadow-sm font-semibold">
                                      <span className={`text-[10px] px-1.5 py-0.5 rounded flex items-center ${authRole === 'production' ? '' : 'mr-1.5'} font-black whitespace-nowrap ${f.country === '베트남' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {f.country}
                                      </span>
                                      {authRole !== 'production' && f.agency}
                                    </span>
                                  </div>
                                ))}
                                {(filterStatus === null || filterStatus === 'planned') && item.unfulfilledCount > 0 && (
                                  <div className="text-xs sm:text-sm text-rose-500 font-bold mt-2 px-2 break-keep whitespace-nowrap flex items-center"><AlertCircle size={14} className="mr-1"/> {item.unfulfilledCount}명 매칭 대기중 (공급 부족)</div>
                                )}
                              </div>
                            )}
                          </td>
                          <td className="p-4 sm:p-5 align-middle text-center">
                            {isFullyArrived ? 
                              <span className="px-4 py-1.5 rounded-full font-black bg-cyan-100 text-cyan-800 text-sm break-keep whitespace-nowrap shadow-sm border border-cyan-200">배치완료</span> : 
                              arrivedCount > 0 ? 
                              <span className="px-4 py-1.5 rounded-full font-black bg-blue-50 text-blue-700 text-sm break-keep whitespace-nowrap shadow-sm border border-blue-200">부분 ({arrivedCount}/{item.reqCount})</span> :
                              <span className="px-4 py-1.5 rounded-full font-bold bg-slate-100 text-slate-500 text-sm break-keep whitespace-nowrap shadow-sm border border-slate-200">입국대기</span>
                            }
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      ) : null;
    };

    const ConfirmedDeptModal = ({ isOpen, onClose, selection, confirmedDeptSummary, filterStatus, authRole }) => {
      const deptData = (confirmedDeptSummary && selection) ? confirmedDeptSummary.find(d => d.name === selection.dept) : null;

      let displayInds = [];
      if (deptData && selection) {
        if (selection.job) {
           displayInds = deptData.jobs[selection.job]?.inds || [];
        } else {
           Object.values(deptData.jobs).forEach(j => displayInds.push(...j.inds));
        }
      }

      let statusLabel = '총 인원';
      if (filterStatus === 'completed') statusLabel = '입국 완료';
      else if (filterStatus === 'planned') statusLabel = '입국 예정';
      else if (filterStatus === 'current_wave') statusLabel = '당해 입국';

      return isOpen && selection && deptData ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-4 sm:p-6 animate-in fade-in duration-200">
          <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-6xl overflow-hidden animate-in zoom-in-95 duration-300 max-h-[90vh] flex flex-col border border-slate-200">
            <div className="bg-gradient-to-r from-cyan-700 to-blue-800 p-6 sm:p-8 flex justify-between items-center text-white shrink-0 gap-4 shadow-md">
              <div className="flex items-center space-x-4 sm:space-x-5 min-w-0">
                <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm border border-white/10 shadow-inner shrink-0">
                   <UserCheck size={28} className="text-white" />
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black tracking-tight truncate break-keep text-white drop-shadow-md">
                    {selection.dept} 부서 확정 명단 {selection.job && <span className="text-cyan-200 ml-2 font-extrabold">- {selection.job}</span>}
                  </h2>
                </div>
                <span className="hidden sm:inline-flex items-center bg-black/20 border border-white/10 backdrop-blur-md px-4 py-1.5 rounded-full text-sm sm:text-base font-bold shadow-inner whitespace-nowrap ml-4">
                  {statusLabel}: {displayInds.length}명
                </span>
              </div>
